<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自媒体 90% 慢知识生产流程与议程设置 | 交互式 2D 动画全案</title>
<style>
  :root {
    --bg-dark: #070b14;
    --bg-card: #0f172a;
    --bg-panel: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --cyan: #06b6d4;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --rose: #f43f5e;
    --emerald: #10b981;
    --purple: #8b5cf6;
    --border: #334155;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部导航栏 */
  header {
    height: 64px;
    background: rgba(15, 23, 42, 0.92);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    flex-shrink: 0;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-badge {
    background: linear-gradient(135deg, var(--amber), var(--rose));
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }

  .brand-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-main);
  }

  .step-nav {
    display: flex;
    gap: 6px;
  }

  .step-btn {
    padding: 6px 11px;
    border-radius: 6px;
    background: var(--bg-panel);
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.25s ease;
  }

  .step-btn:hover {
    color: var(--text-main);
    border-color: var(--border);
  }

  .step-btn.active {
    background: rgba(6, 182, 212, 0.16);
    color: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    background: var(--bg-panel);
    color: var(--text-main);
    border: 1px solid var(--border);
    padding: 7px 13px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover {
    background: #334155;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    border-color: transparent;
  }

  /* 进度条 */
  .progress-bar {
    height: 3px;
    background: var(--bg-panel);
    width: 100%;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--amber), var(--cyan), var(--emerald));
    width: 16.66%;
    transition: width 0.3s ease;
  }

  /* 主体区域 */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 400px;
    overflow: hidden;
  }

  /* 左侧 SVG 动画舞台 */
  .stage {
    position: relative;
    background: radial-gradient(circle at 50% 45%, #131d35 0%, #070b14 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    overflow: hidden;
  }

  .scene {
    width: 100%;
    height: 100%;
    max-width: 1060px;
    max-height: 680px;
    display: none;
    animation: sceneEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .scene.active {
    display: block;
  }

  @keyframes sceneEnter {
    from { opacity: 0; transform: translateY(6px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* 右侧深度讲义栏 */
  .sidebar {
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    padding: 26px 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-y: auto;
  }

  .chapter-badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--amber);
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.35);
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 10px;
  }

  .chapter-title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 14px;
    color: #fff;
  }

  .chapter-quote {
    background: rgba(30, 41, 59, 0.75);
    border-left: 3px solid var(--cyan);
    padding: 11px 13px;
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    color: #e2e8f0;
    line-height: 1.58;
    margin-bottom: 18px;
    font-style: italic;
  }

  .logic-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .logic-card {
    background: rgba(7, 11, 20, 0.65);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .logic-card-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--cyan);
    margin-bottom: 5px;
  }

  .logic-card-desc {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.55;
  }

  .sidebar-footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* SVG 内部 2D 动画类 */
  .flow-dash {
    fill: none;
    stroke-dasharray: 8 6;
    animation: dashMove 1.1s linear infinite;
  }

  @keyframes dashMove {
    to { stroke-dashoffset: -28; }
  }

  .float-up {
    animation: floatAnim 3.2s ease-in-out infinite;
  }

  .float-down {
    animation: floatAnim 3.2s ease-in-out 1.6s infinite;
  }

  @keyframes floatAnim {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }

  .pulse-ring {
    transform-origin: center;
    transform-box: fill-box;
    animation: pulseScale 2.2s ease-in-out infinite;
  }

  @keyframes pulseScale {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.06); opacity: 1; }
  }

  .spin-slow {
    transform-origin: center;
    transform-box: fill-box;
    animation: spin360 10s linear infinite;
  }

  @keyframes spin360 {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 1024px) {
    main {
      grid-template-columns: 1fr;
      grid-template-rows: 58% 42%;
    }
    .sidebar {
      border-left: none;
      border-top: 1px solid var(--border);
    }
    .brand-title { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-badge">内部收费级全案</span>
    <span class="brand-title">内容生产逆向工程 · 议程设置与语言游戏 2D 动态图解</span>
  </div>

  <div class="step-nav">
    <button class="step-btn active" onclick="goScene(0)">01. 逆向创作流</button>
    <button class="step-btn" onclick="goScene(1)">02. 破除流量二元论</button>
    <button class="step-btn" onclick="goScene(2)">03. 抽象升维与合集</button>
    <button class="step-btn" onclick="goScene(3)">04. 剩余享乐解剖</button>
    <button class="step-btn" onclick="goScene(4)">05. 定位vs议程设置</button>
    <button class="step-btn" onclick="goScene(5)">06. 语言游戏解构选题</button>
  </div>

  <div class="controls">
    <button class="btn" onclick="prevScene()">◀ 上一幕</button>
    <button class="btn btn-primary" id="playBtn" onclick="togglePlay()">▶ 自动巡演</button>
    <button class="btn" onclick="nextScene()">下一幕 ▶</button>
  </div>
</header>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<main>
  <div class="stage">

    <!-- ==================== 第 1 幕：逆向内容生产流（隐性成本与开锁匠案例） ==================== -->
    <div class="scene active" id="scene-0">
      <svg viewBox="0 0 920 560">
        <defs>
          <marker id="arrCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
          </marker>
          <marker id="arrRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
          </marker>
          <marker id="arrEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
          </marker>
        </defs>

        <text x="460" y="36" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">为什么我“不得不跟别人不一样”？逆向内容生产全流程</text>
        <text x="460" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">普通人从“刷爆款选题”开始洗稿必死；我是从“搞懂一个底层理论（Why）”逆向反推大众现象</text>

        <!-- 上半层：普通人正向洗稿死胡同 -->
        <g transform="translate(40, 82)">
          <rect x="0" y="0" width="840" height="92" rx="10" fill="#26121b" stroke="#f43f5e" stroke-width="1.5"/>
          <rect x="16" y="14" width="135" height="22" rx="4" fill="#f43f5e"/>
          <text x="83" y="29" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="800">❌ 99%的人正向洗稿流</text>
          <text x="165" y="29" fill="#fda4af" font-size="12.5" font-weight="700">为什么别人模仿我《老实人为什么发不了财》全部失败？</text>

          <g transform="translate(16, 44)">
            <rect x="0" y="0" width="210" height="36" rx="6" fill="#1e1b2e" stroke="#fb7185"/>
            <text x="105" y="22" text-anchor="middle" fill="#fecdd3" font-size="12">1. 刷抖音看别人火了什么选题</text>

            <path d="M 215 18 L 265 18" stroke="#f43f5e" stroke-width="2" class="flow-dash" marker-end="url(#arrRose)"/>

            <rect x="275" y="0" width="255" height="36" rx="6" fill="#1e1b2e" stroke="#fb7185"/>
            <text x="402" y="22" text-anchor="middle" fill="#fecdd3" font-size="12">2. 硬换里面的4个观点/背后理论</text>

            <path d="M 535 18 L 585 18" stroke="#f43f5e" stroke-width="2" class="flow-dash" marker-end="url(#arrRose)"/>

            <rect x="595" y="0" width="210" height="36" rx="6" fill="rgba(244, 63, 94, 0.25)" stroke="#f43f5e"/>
            <text x="700" y="22" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">💥 累死也找不到替代理论→垃圾</text>
          </g>
        </g>

        <!-- 下半层：栋哥逆向工程（3步法） -->
        <g transform="translate(40, 195)">
          <rect x="0" y="0" width="840" height="330" rx="12" fill="#0d1829" stroke="#06b6d4" stroke-width="2"/>
          <rect x="18" y="16" width="165" height="24" rx="4" fill="#06b6d4"/>
          <text x="100" y="32" text-anchor="middle" fill="#070b14" font-size="12" font-weight="800">✅ 我的逆向创作工程 (Why→现象)</text>
          <text x="198" y="32" fill="#22d3ee" font-size="13" font-weight="700">先搞懂底层理论，再找大众错误认知解释不了的现象（若开头撞车纯属1%巧合）</text>

          <!-- Step 1: 搞懂 Why -->
          <g transform="translate(20, 58)">
            <rect x="0" y="0" width="235" height="250" rx="10" fill="#111f36" stroke="#38bdf8" stroke-width="1.5"/>
            <circle cx="32" cy="30" r="14" fill="#06b6d4"/>
            <text x="32" y="35" text-anchor="middle" fill="#070b14" font-size="13" font-weight="800">1</text>
            <text x="56" y="35" fill="#fff" font-size="14" font-weight="800">搞懂底层问题 (Why)</text>

            <rect x="14" y="54" width="207" height="62" rx="6" fill="#1e293b"/>
            <text x="117" y="76" text-anchor="middle" fill="#cbd5e1" font-size="12">现实困惑：为什么劣币驱逐良币？</text>
            <text x="117" y="98" text-anchor="middle" fill="#94a3b8" font-size="11.5">劣质商品反而比好东西赚钱更多？</text>

            <path d="M 117 120 L 117 142" stroke="#06b6d4" stroke-width="2" class="flow-dash" marker-end="url(#arrCyan)"/>

            <rect x="14" y="148" width="207" height="84" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4"/>
            <text x="117" y="172" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="800">💡 与 AI 深度对谈得出理论：</text>
            <text x="117" y="196" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">【隐性成本】</text>
            <text x="117" y="218" text-anchor="middle" fill="#fda4af" font-size="11">⚠️ 直接讲“2026要懂隐性成本”=曲高和寡0播放</text>
          </g>

          <path d="M 260 180 L 295 180" stroke="#06b6d4" stroke-width="3" class="flow-dash" marker-end="url(#arrCyan)"/>

          <!-- Step 2: 刺破大众错误常识 + 开锁匠案例 -->
          <g transform="translate(302, 58)">
            <rect x="0" y="0" width="275" height="250" rx="10" fill="#111f36" stroke="#f59e0b" stroke-width="1.5"/>
            <circle cx="32" cy="30" r="14" fill="#f59e0b"/>
            <text x="32" y="35" text-anchor="middle" fill="#070b14" font-size="13" font-weight="800">2</text>
            <text x="56" y="35" fill="#fff" font-size="14" font-weight="800">找大众错误认知 &amp; 具象案例</text>

            <rect x="14" y="54" width="247" height="52" rx="6" fill="#1e293b"/>
            <text x="137" y="75" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">大众痛点：赚钱的不是技术好，而是会销售</text>
            <text x="137" y="94" text-anchor="middle" fill="#94a3b8" font-size="11">（大众分不清“功劳”与“苦劳”，产生认知盲区）</text>

            <!-- 两个锁匠对比 -->
            <g transform="translate(14, 116)">
              <rect x="0" y="0" width="118" height="118" rx="6" fill="#2a121d" stroke="#f43f5e"/>
              <text x="59" y="22" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="700">🔑 锁匠 A (技术神)</text>
              <text x="59" y="44" text-anchor="middle" fill="#cbd5e1" font-size="11">1秒捅开收5000元</text>
              <text x="59" y="64" text-anchor="middle" fill="#fda4af" font-size="11">客户骂：这锁本来</text>
              <text x="59" y="80" text-anchor="middle" fill="#fda4af" font-size="11">就好开！拒绝付款</text>
              <text x="59" y="104" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="700">解法:提前发冠军视频背书</text>

              <rect x="128" y="0" width="118" height="118" rx="6" fill="#112a22" stroke="#10b981"/>
              <text x="187" y="22" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">💦 锁匠 B (懂人性)</text>
              <text x="187" y="44" text-anchor="middle" fill="#cbd5e1" font-size="11">明明1秒能开</text>
              <text x="187" y="64" text-anchor="middle" fill="#cbd5e1" font-size="11">故意满头大汗卖惨</text>
              <text x="187" y="80" text-anchor="middle" fill="#cbd5e1" font-size="11">折腾半小时才打开</text>
              <text x="187" y="104" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">结果:客户爽快付钱无售后</text>
            </g>
          </g>

          <path d="M 582 180 L 615 180" stroke="#10b981" stroke-width="3" class="flow-dash" marker-end="url(#arrEmerald)"/>

          <!-- Step 3: 爆款包装输出 -->
          <g transform="translate(622, 58)">
            <rect x="0" y="0" width="198" height="250" rx="10" fill="#112a22" stroke="#10b981" stroke-width="2"/>
            <circle cx="32" cy="30" r="14" fill="#10b981"/>
            <text x="32" y="35" text-anchor="middle" fill="#070b14" font-size="13" font-weight="800">3</text>
            <text x="56" y="35" fill="#fff" font-size="14" font-weight="800">降维引出理论</text>

            <rect x="14" y="56" width="170" height="75" rx="8" fill="#064e3b" stroke="#34d399" class="pulse-ring"/>
            <text x="99" y="80" text-anchor="middle" fill="#a7f3d0" font-size="11.5">最终诞生全网爆款选题：</text>
            <text x="99" y="104" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="800">《老实人为什么</text>
            <text x="99" y="122" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="800">发不了财？》</text>

            <text x="14" y="158" fill="#cbd5e1" font-size="11.5">• 开头：用大众痛点抓人</text>
            <text x="14" y="180" fill="#cbd5e1" font-size="11.5">• 中段：用开锁案例刺破常识</text>
            <text x="14" y="202" fill="#cbd5e1" font-size="11.5">• 升华：抛出【隐性成本】收割崇拜</text>
            <text x="14" y="228" fill="#fbbf24" font-size="11.5" font-weight="700">✨ 抄我流程：保留隐性成本，换几个案例即可原创！</text>
          </g>
        </g>
      </svg>
    </div>

    <!-- ==================== 第 2 幕：10% 独特事件 vs 90% 慢知识（干掉二元论） ==================== -->
    <div class="scene" id="scene-1">
      <svg viewBox="0 0 920 560">
        <text x="460" y="36" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">内容配比（10% vs 90%）与彻底干掉“泛流量/精准流量”二元论</text>
        <text x="460" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">最危险的账号是“有流量没人关注/不转化（漏斗下方断裂）”；真正的高手用大众开口讲深厚理论</text>

        <!-- 左侧：10% 独特事件 vs 90% 慢知识生产 -->
        <g transform="translate(35, 90)">
          <rect x="0" y="0" width="380" height="430" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
          <text x="190" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="800">📊 账号独特性的两大来源配比</text>

          <!-- 10% 独特事件 -->
          <g transform="translate(20, 52)">
            <rect x="0" y="0" width="340" height="145" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
            <rect x="14" y="14" width="120" height="22" rx="4" fill="#8b5cf6"/>
            <text x="74" y="29" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="800">10% · 独特事件流</text>
            <text x="146" y="29" fill="#c4b5fd" font-size="12" font-weight="700">产出极快（几分钟拍完，不过脑子）</text>
            <text x="14" y="58" fill="#cbd5e1" font-size="12">• 案例1：《我被纳瓦尔(Naval)拉黑了》</text>
            <text x="24" y="76" fill="#94a3b8" font-size="11.5">下午1点拍完不到1分钟，5点破10万播放、百条评论</text>
            <text x="14" y="100" fill="#cbd5e1" font-size="12">• 案例2：《开源商业方法论 db skill 赚了7位数》</text>
            <text x="14" y="126" fill="#fbbf24" font-size="11.5" font-weight="700">⚠️ 局限：被名人拉黑十年一遇，可遇不可求，撑死占10%</text>
          </g>

          <!-- 90% 慢知识生产 -->
          <g transform="translate(20, 215)">
            <rect x="0" y="0" width="340" height="195" rx="8" fill="#0f293a" stroke="#06b6d4" stroke-width="2"/>
            <rect x="14" y="14" width="120" height="22" rx="4" fill="#06b6d4"/>

  let cur = 0;
  let timer = null;

  function renderPanel(idx) {
    const d = chapters[idx];
    const box = document.getElementById('sidebarContent');
    const listHtml = d.cards.map(c => `
      <li class="logic-card">
        <div class="logic-card-title">✦ ${c.title}</div>
        <div class="logic-card-desc">${c.desc.replace(/\n/g, '<br>')}</div>
      </li>
    `).join('');

    box.innerHTML = `
      <span class="chapter-badge">${d.badge}</span>
      <h2 class="chapter-title">${d.title}</h2>
      <div class="chapter-quote">${d.quote}</div>
      <ul class="logic-list">${listHtml}</ul>
    `;

    document.getElementById('sceneIndexText').textContent = `第 ${idx + 1} / ${chapters.length} 幕`;
    document.getElementById('progressFill').style.width = `${((idx + 1) / chapters.length) * 100}%`;
  }

  function goScene(idx) {
    cur = idx;
    document.querySelectorAll('.scene').forEach((el, i) => el.classList.toggle('active', i === idx));
    document.querySelectorAll('.step-btn').forEach((el, i) => el.classList.toggle('active', i === idx));
    renderPanel(idx);
  }

  function nextScene() {
    goScene((cur + 1) % chapters.length);
  }

  function prevScene() {
    goScene((cur - 1 + chapters.length) % chapters.length);
  }

  function togglePlay() {
    const btn = document.getElementById('playBtn');
    if (timer) {
      clearInterval(timer);
      timer = null;
      btn.textContent = '▶ 自动巡演';
    } else {
      timer = setInterval(nextScene, 7000);
      btn.textContent = '⏸ 暂停巡演';
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextScene();
    if (e.key === 'ArrowLeft') prevScene();
  });

  renderPanel(0);
</script>
