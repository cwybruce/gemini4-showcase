<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 肝脏全景科普交互馆 · 六大核心真相</title>
  <style>
    :root {
      --bg-dark: #0b0f17;
      --bg-panel: rgba(16, 23, 36, 0.82);
      --bg-panel-light: rgba(25, 35, 54, 0.78);
      --border-glass: rgba(255, 255, 255, 0.13);
      --accent-red: #e04f44;
      --accent-gold: #f5b942;
      --accent-green: #2ecc71;
      --accent-blue: #3898ff;
      --accent-purple: #a569ff;
      --text-main: #f3f6fa;
      --text-muted: #98a6be;
      --shadow-soft: 0 12px 36px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 42%, #1d273b 0%, #090d15 100%);
      color: var(--text-main);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* 3D 空间浮动标签容器 */
    #labels-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .label-3d {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(12, 18, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .label-3d:hover, .label-3d.active {
      transform: translate(-50%, -50%) scale(1.1);
      background: rgba(30, 46, 74, 0.95);
      border-color: var(--accent-gold);
      z-index: 20;
    }

    .label-3d .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    .label-3d .sub {
      font-size: 10px;
      font-weight: 400;
      color: #cbd5e1;
      opacity: 0.88;
    }

    /* 顶部导航栏 */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: linear-gradient(180deg, rgba(8, 12, 20, 0.94) 0%, rgba(8, 12, 20, 0.72) 85%, transparent 100%);
      padding: 12px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #c0392b, #8e1c14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 4px 14px rgba(224, 79, 68, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      pointer-events: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(20, 29, 46, 0.78);
      border: 1px solid var(--border-glass);
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .nav-tab:hover {
      background: rgba(38, 52, 79, 0.88);
      color: #fff;
      transform: translateY(-1px);
    }

    .nav-tab.active {
      background: linear-gradient(135deg, rgba(224, 79, 68, 0.92), rgba(178, 43, 35, 0.92));
      border-color: rgba(255, 195, 160, 0.55);
      color: #fff;
      box-shadow: 0 6px 20px rgba(224, 79, 68, 0.38);
    }

    .nav-tab .tab-num {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.14);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
    }

    .nav-tab.active .tab-num {
      background: rgba(255, 255, 255, 0.26);
    }

    /* 左侧主题与核心交互控制面板 */
    .left-panel {
      position: fixed;
      top: 108px;
      left: 18px;
      width: 330px;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
    }

    .glass-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .scene-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(245, 185, 66, 0.16);
      color: var(--accent-gold);
      border: 1px solid rgba(245, 185, 66, 0.35);
      margin-bottom: 8px;
    }

    .scene-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.28;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ffffff, #ffd9c4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .scene-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 场景专属交互控件区 */
    .control-section-title {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .slider-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }

    input[type="range"].custom-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #2ecc71 0%, #f5b942 50%, #e04f44 100%);
      outline: none;
      cursor: pointer;
    }

    input[type="range"].custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #e04f44;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      cursor: grab;
    }

    .mode-btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .mode-btn-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .mode-btn-grid.cols-1 {
      grid-template-columns: 1fr;
    }

    .mode-btn {
      padding: 9px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .mode-btn.active {
      background: rgba(245, 185, 66, 0.2);
      border-color: var(--accent-gold);
      color: #fff;
      box-shadow: 0 0 14px rgba(245, 185, 66, 0.25);
    }

    .mode-btn .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* 场景6 化验单微缩组件 */
    .lab-sheet {
      background: rgba(248, 250, 252, 0.95);
      color: #1e293b;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 11px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    }

    .lab-sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 12px;
      border-bottom: 1.5px solid #cbd5e1;
      padding-bottom: 5px;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .lab-row {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr 1fr;
      padding: 3px 0;
      border-bottom: 1px dashed #e2e8f0;
    }

    .lab-row.head {
      font-weight: 700;
      color: #64748b;
      font-size: 10px;
    }

    .lab-val-ok {
      color: #16a34a;
      font-weight: 700;
    }

    /* 右侧知识点步骤/卡片详情面板 */
    .right-panel {
      position: fixed;
      top: 108px;
      right: 18px;
      width: 350px;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
    }

    .step-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.22s ease;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
    }

    .step-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--card-color, var(--accent-gold));
      opacity: 0.75;
    }

    .step-card:hover, .step-card.active {
      transform: translateX(-3px);
      border-color: var(--card-color, var(--accent-gold));
      background: rgba(28, 40, 64, 0.9);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .step-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-index {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--card-color, var(--accent-gold));
      color: #0b0f17;
      font-weight: 800;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .step-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .step-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-weight: 600;
    }

    .step-desc {
      font-size: 12px;
      color: #b6c2d6;
      line-height: 1.5;
      padding-left: 30px;
    }

    .step-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
      padding-left: 30px;
    }

    .step-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    /* 底部核心金句与 3D 视角控制栏 */
    .bottom-bar {
      position: fixed;
      bottom: 14px;
      left: 18px;
      right: 18px;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .slogan-banner {
      pointer-events: auto;
      background: linear-gradient(90deg, rgba(19, 27, 43, 0.92), rgba(35, 22, 28, 0.92));
      border: 1px solid rgba(245, 185, 66, 0.35);
      border-radius: 14px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: 720px;
    }

    .slogan-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(245, 185, 66, 0.18);
      border: 1px solid rgba(245, 185, 66, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .slogan-text strong {
      display: block;
      font-size: 14px;
      color: #ffd984;
      margin-bottom: 2px;
    }

    .slogan-text span {
      font-size: 12px;
      color: #cbd5e1;
    }

    .cam-controls {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-glass);
      padding: 6px 10px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
    }

    .cam-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cam-btn:hover, .cam-btn.active {
      background: rgba(224, 79, 68, 0.85);
      border-color: #ff9f97;
      color: #fff;
    }

    /* 移动端抽屉切换按钮 */
    .mobile-drawer-toggle {
      display: none;
    }

    /* 响应式适配：平板与手机端 */
    @media (max-width: 960px) {
      .left-panel {
        top: 102px;
        left: 12px;
        width: calc(100vw - 24px);
        max-height: none;
        pointer-events: none;
      }

      .left-panel .glass-card {
        pointer-events: auto;
        padding: 12px 14px;
      }

      .scene-title {
        font-size: 17px;
      }

      .scene-subtitle {
        font-size: 12px;
      }

      .right-panel {
        top: auto;
        bottom: 64px;
        left: 12px;
        right: 12px;
        width: auto;
        max-height: 36vh;
        background: rgba(11, 16, 26, 0.92);
        border: 1px solid var(--border-glass);
        border-radius: 16px;
        padding: 10px;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
      }

      .right-panel.collapsed {
        transform: translateY(calc(100% + 70px));
        opacity: 0;
        pointer-events: none;
      }

      .bottom-bar {
        bottom: 10px;
        left: 12px;
        right: 12px;
      }

      .slogan-banner {
        display: none;
      }

      .cam-controls {
        width: 100%;
        justify-content: space-between;
      }

      .mobile-drawer-toggle {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .label-3d {
        font-size: 11px;
        padding: 4px 9px;
      }
      .label-3d .sub {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- 3D 渲染容器 -->
  <div id="canvas-container"></div>

  <!-- 3D 锚点浮动 HTML 标签层 -->
  <div id="labels-container"></div>

  <!-- 顶部场景导航 -->
  <header class="top-nav">
    <div class="brand-bar">
      <div class="brand-title">
        <div class="brand-badge">肝</div>
        <div class="brand-text">
          <h1>3D 肝脏全景科普交互馆</h1>
          <p>拖拽旋转 3D 肝脏 · 点击节点或卡片拆解六大生理真相</p>
        </div>
      </div>
      <div style="font-size: 12px; color: var(--text-muted);" id="scene-counter">场景 1 / 6</div>
    </div>

    <nav class="nav-tabs" id="nav-tabs">
      <button class="nav-tab active" data-scene="0">
        <span class="tab-num">①</span><span>再生与留疤</span>
      </button>
      <button class="nav-tab" data-scene="1">
        <span class="tab-num">②</span><span>吃进去先见肝</span>
      </button>
      <button class="nav-tab" data-scene="2">
        <span class="tab-num">③</span><span>酒精伤肝真相</span>
      </button>
      <button class="nav-tab" data-scene="3">
        <span class="tab-num">④</span><span>代谢中枢工厂</span>
      </button>
      <button class="nav-tab" data-scene="4">
        <span class="tab-num">⑤</span><span>多器官协同网</span>
      </button>
      <button class="nav-tab" data-scene="5">
        <span class="tab-num">⑥</span><span>转氨酶≠没事</span>
      </button>
    </nav>
  </header>

  <!-- 左侧场景标题与专属交互控制器 -->
  <aside class="left-panel" id="left-panel">
    <div class="glass-card">
      <div class="scene-tag" id="ui-scene-tag">核心科普 ① · 组织修复机制</div>
      <h2 class="scene-title" id="ui-scene-title">肝脏会再生，但不会无限重生</h2>
      <p class="scene-subtitle" id="ui-scene-subtitle">偶发损伤可启动肝细胞增殖与结构重建；但长期反复损伤会让胶原纤维不断沉积，把修复变成留疤。</p>
      <div id="ui-custom-controls" style="margin-top: 12px;"></div>
    </div>
  </aside>

  <!-- 右侧分步/分项知识卡片流 -->
  <aside class="right-panel" id="right-panel"></aside>

  <!-- 底部核心金句与视角栏 -->
  <footer class="bottom-bar">
    <div class="slogan-banner">
      <div class="slogan-icon">💡</div>
      <div class="slogan-text">
        <strong id="ui-slogan-main">反复损伤，会把修复变成留疤。</strong>
        <span id="ui-slogan-sub">保护肝脏的关键是减少持续性伤害，给肝细胞留出真正的修复窗口。</span>
      </div>
    </div>

    <div class="cam-controls">
      <button class="cam-btn mobile-drawer-toggle" id="btn-toggle-drawer">📋 知识卡片</button>
      <button class="cam-btn" id="btn-prev">◀ 上一幕</button>
      <button class="cam-btn active" id="btn-autorotate">↻ 自动微旋</button>
      <button class="cam-btn" id="btn-reset-cam">🎯 复位视角</button>
      <button class="cam-btn" id="btn-next">下一幕 ▶</button>
    </div>
  </footer>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // ============================================================================
    // 1. 六大场景结构化科普数据库（严格还原 6 张附图全部知识点与细节）
    // ============================================================================
    const SCENES_DATA = [
      {
        id: 0,
        tag: "核心科普 ① · 修复 vs 留疤",
        title: "肝脏会再生，但不会无限重生",
        subtitle: "左侧展示健康肝脏的再生修复机制，右侧展示反复损伤导致的胶原沉积与纤维化留疤。",
        sloganMain: "反复损伤，会把修复变成留疤。",
        sloganSub: "肝脏拥有人体内脏中最强的再生能力，但慢性炎症与反复损伤会摧毁肝小叶脚手架，走向肝硬化。",
        camPos: { x: 0, y: 0.6, z: 9.2 },
        camTarget: { x: 0, y: 0, z: 0 },
        cards: [
          {
            idx: "修1",
            title: "细胞增殖（修复侧）",

    // 生成程序化肝小叶凹凸纹理（Bump & Roughness Map）
    function createHepaticTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#808080";
      ctx.fillRect(0, 0, 512, 512);

      // 绘制细腻的肝小叶多边形蜂窝纹理与有机微噪点
      for (let i = 0; i < 600; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = 6 + Math.random() * 14;
        const grad = ctx.createRadialGradient(x, y, 1, x, y, r);
        grad.addColorStop(0, "rgba(220,220,220,0.35)");
        grad.addColorStop(0.7, "rgba(110,110,110,0.2)");
        grad.addColorStop(1, "rgba(60,60,60,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 2);
      return tex;
    }

    const hepaticBumpTex = createHepaticTexture();

    /**
     * 解剖级 3D 肝脏几何体生成函数
     * 将高细分球体通过数学解剖曲面方程雕刻为：丰满圆润的肝右叶 + 渐收窄薄的肝左叶 + 镰状韧带裂隙 + 肝门凹陷
     * @param {Object} opts 配置参数（nodular: 硬化结节度, scale: 缩放, clipSide: 'all'|'left'|'right'）
     */
    function createAnatomicalLiverGeometry(opts = {}) {
      const nodular = opts.nodular || 0;
      const geo = new THREE.SphereGeometry(1.8, 72, 54);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();

      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);

        // 归一化方向参数
        let x = v.x / 1.8; // 左右: -1 (右叶在画面左侧) ~ +1 (左叶在画面右侧)
        let y = v.y / 1.8; // 上下
        let z = v.z / 1.8; // 前后

        // 1. 横向拉伸形成肝脏宽楔形
        x *= 1.55;
        y *= 0.98;
        z *= 0.78;

        // 2. 肝右叶（画面左侧 x < 0）丰满圆润并向下延伸；肝左叶（画面右侧 x > 0）向尖端收窄上翘
        if (x > 0) {
          const t = x / 1.55; // 0 -> 1
          y *= (1.0 - 0.52 * Math.pow(t, 1.15));
          z *= (1.0 - 0.48 * Math.pow(t, 1.2));
          y += 0.25 * Math.pow(t, 1.1); // 左叶微微上翘
        } else {
          const t = Math.abs(x) / 1.55;
          y -= 0.22 * Math.sin(t * Math.PI * 0.85) * (y < 0 ? 1.35 : 0.4); // 右叶下缘饱满下垂
          z *= (1.0 + 0.12 * Math.sin(t * Math.PI));
        }

        // 3. 膈面（顶部）呈圆顶状贴合横膈膜，脏面（底部内侧）呈内凹斜坡容纳胆囊与胃十二指肠
        if (y < 0) {
          const bottomFactor = Math.abs(y);
          z -= 0.18 * bottomFactor * Math.exp(-x * x);
          if (x > -0.3 && x < 0.9) {
            y += 0.24 * bottomFactor * (x + 0.35);
          }
        }

        // 4. 镰状韧带分界浅沟（位于 x ≈ 0.15 处）
        const groove = Math.exp(-Math.pow((x - 0.12) * 5.5, 2));
        z -= 0.11 * groove * Math.max(0, z);
        y -= 0.06 * groove * Math.max(0, y);

        // 5. 若开启硬化结节变形（用于场景①右侧留疤侧）
        if (nodular > 0 && x > 0.05) {
          const rightIntensity = Math.min(1, (x - 0.05) * 1.4) * nodular;
          const n1 = Math.sin(x * 9.0) * Math.cos(y * 9.0) * Math.sin(z * 9.0);
          const n2 = Math.sin(x * 17.0 + 1.3) * Math.cos(y * 16.0 - 0.8);
          const bump = (n1 * 0.14 + n2 * 0.07) * rightIntensity;
          x *= (1 - 0.1 * rightIntensity); // 纤维化萎缩
          y *= (1 - 0.1 * rightIntensity);
          x += (v.x / 1.8) * bump;
          y += (v.y / 1.8) * bump;
          z += (v.z / 1.8) * bump;
        }

        pos.setXYZ(i, x * 1.35, y * 1.35, z * 1.35);
      }

      geo.computeVertexNormals();
      return geo;
    }

    // 通用工具：创建沿 3D 样条曲线流动的发光管道与粒子流
    function createPathTube(points, radius, color, opacity = 0.55) {
      const curve = new THREE.CatmullRomCurve3(points);
      const geo = new THREE.TubeGeometry(curve, 48, radius, 14, false);
      const mat = new THREE.MeshPhysicalMaterial({
        color,
        transparent: true,
        opacity,
        roughness: 0.25,
        metalness: 0.1,
        clearcoat: 0.6
      });
      const mesh = new THREE.Mesh(geo, mat);
      return { mesh, curve };
    }

    // ----------------------------------------------------------------------------

      const vesselBranches = [

      for (let f = 0; f < 28; f++) {

          const t = step / 6;

          const z = Math.cos(f * 0.9 + step * 0.8) * 0.85 * (1 - t * 0.42);

        }
        const curve = new THREE.CatmullRomCurve3(pts);

        scarGroup.add(new THREE.Mesh(tubeGeo, fiberMat));

      // (b) 硬化假小叶/结构紊乱暗褐色结节球簇

      // 滑块形变更新函数
      group.userData.updateScarRatio = (ratio) => {

    // ----------------------------------------------------------------------------
    // 构建场景 ③：酒精真正伤肝的地方不是喝醉（肝细胞内代谢真相）

    function buildScene3() {
      const group = new THREE.Group();

      // 1. 巨型 3D 肝细胞半透明切面外壳（还原附图肝细胞内部包膜）

      // 细胞膜外框环线
      const rimGeo = new THREE.TorusGeometry(2.95, 0.08, 16, 80);
      rimGeo.scale(0.92, 1.08, 1);
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xc89070, roughness: 0.5 });
      group.add(new THREE.Mesh(rimGeo, rimMat));

      // 工具函数：构建 3D 球棍化学分子模型（乙醇、乙醛、乙酸）
      function createMolecule3D(atoms, bonds) {
        const mol = new THREE.Group();
        const atomMap = {
          C: { r: 0.16, color: 0x475569 },
          O: { r: 0.18, color: 0xef4444 },
          H: { r: 0.10, color: 0xf8fafc }
        };
        atoms.forEach(a => {
          const cfg = atomMap[a.el];
          const m = new THREE.Mesh(
            new THREE.SphereGeometry(cfg.r, 20, 20),
            new THREE.MeshPhysicalMaterial({ color: cfg.color, roughness: 0.2, clearcoat: 0.8 })
          );
          m.position.set(...a.pos);
          mol.add(m);
        });
        bonds.forEach(([i, j]) => {
          const p1 = new THREE.Vector3(...atoms[i].pos);
          const p2 = new THREE.Vector3(...atoms[j].pos);
          const dist = p1.distanceTo(p2);
          const cyl = new THREE.Mesh(
            new THREE.CylinderGeometry(0.035, 0.035, dist, 10),
            new THREE.MeshStandardMaterial({ color: 0xcbd5e1 })
          );
          cyl.position.copy(p1).add(p2).multiplyScalar(0.5);
          cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize());
          mol.add(cyl);
        });
        return mol;
      }

      // (a) 顶部：酒精（乙醇 C2H5OH）分子
      const ethanolMol = createMolecule3D(

          { el: "H", pos: [0.82, -0.05, 0.15] },
          { el: "H", pos: [-0.45, 0.25, 0.18] },
          { el: "H", pos: [-0.45, -0.25, -0.18] }

      ethanolMol.position.set(-0.55, 2.15, 0.2);
      group.add(ethanolMol);

      // (b) ADH（酒精脱氢酶 - 蓝色生物酶蛋白云团）

      acetaldehydeWrap.add(dangerAura);
      group.add(acetaldehydeWrap);

      // (d) ALDH（乙醛脱氢酶 - 绿色生物酶蛋白云团）
      const aldhGroup = new THREE.Group();
      aldhGroup.position.set(-0.55, -1.1, 0.2);
      const aldhMat = new THREE.MeshPhysicalMaterial({
        color: 0x2ecc71,
        emissive: 0x15803d,
        emissiveIntensity: 0.35,

        clearcoat: 0.9
      });
      [[-0.25, 0, 0, 0.25], [0, -0.05, 0.08, 0.29], [0.26, 0.04, 0, 0.24]].forEach(([x, y, z, r]) => {

      // (e) 底部：乙酸（CH3COOH - 安全代谢谢幕）

          { el: "C", pos: [0.2, 0, 0] },
          { el: "O", pos: [0.45, 0.3, 0] },

      group.add(aceticMol);

      // 2. 右下侧：受损 3D 线粒体模型 + 活性氧自由基（ROS）爆炸粒子
      const mitoGroup = new THREE.Group();
      mitoGroup.position.set(1.35, -0.45, 0.25);
      mitoGroup.rotation.z = 0.45;

      // 线粒体内膜嵴褶皱
      const cristaeCurve = new THREE.CatmullRomCurve3([

      const cristaeGeo = new THREE.TubeGeometry(cristaeCurve, 48, 0.06, 12, false);

      mitoGroup.add(new THREE.Mesh(cristaeGeo, cristaeMat));
      group.add(mitoGroup);

      // ROS 自由基发光粒子群
      const rosParticles = [];

      registerLabel(2, new THREE.Vector3(0.45, 1.15, 0.35), "ADH 酒精脱氢酶", "将酒精转化为乙醛", "#60a5fa", () => selectCard(0));
      registerLabel(2, new THREE.Vector3(-0.55, 0.45, 0.85), "⚠️ 乙醛 (最伤肝阶段)", "损伤蛋白与DNA", "#e04f44", () => selectCard(1));
      registerLabel(2, new THREE.Vector3(1.55, 0.25, 0.55), "💥 线粒体受损 (ROS)", "自由基激增氧化压力", "#f5b942", () => selectCard(2));
      registerLabel(2, new THREE.Vector3(0.45, -1.1, 0.35), "ALDH 乙醛脱氢酶", "转化为无害乙酸", "#2ecc71", () => selectCard(3));
      registerLabel(2, new THREE.Vector3(-0.55, -2.55, 0.35), "④ 乙酸", "代谢为水与CO₂排出", "#2ecc71", () => selectCard(3));

      sceneGroups.push(group);

        const load = appState.scene3AlcoholLoad; // 0.3 正常 vs 1.0 乙醛蓄积风暴
        ethanolMol.rotation.y = time * 1.1;

        acetMol.rotation.x = Math.sin(time * 3) * 0.4;
        aceticMol.rotation.y = time * 0.9;
        dnaGroup.rotation.y = time * 0.8;

        const pulse = 0.85 + Math.sin(time * (5 + load * 6)) * (0.2 + load * 0.35);
        dangerAura.scale.setScalar(pulse);
        cellShellMat.color.setHex(load > 0.7 ? 0xb93829 : 0xd4a383);

        rosParticles.forEach(p => {
          p.dist += p.speed * (0.6 + load * 1.6);
          if (p.dist > (1.1 + load * 0.9)) p.dist = 0.25;
          p.mesh.position.copy(mitoGroup.position).addScaledVector(p.dir, p.dist);
          p.mesh.rotation.x += 0.08;

      });

          const lipidMat = new THREE.MeshPhysicalMaterial({ color: 0xfbbf24, roughness: 0.15, metalness: 0.2, clearcoat: 1 });
          [[0, 0.1, 0, 0.22], [-0.24, -0.1, 0.1, 0.16], [0.24, -0.08, 0.1, 0.17], [0, -0.22, -0.1, 0.14]].forEach(([x, y, z, r]) => {
            const s = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), lipidMat);
            s.position.set(x, y, z);
            pod.add(s);
          });
        } else if (idx === 2) {
          // 合成蛋白：彩色折叠蛋白质螺旋丝带（TorusKnot）
          const proteinKnot = new THREE.Mesh(
            new THREE.TorusKnotGeometry(0.26, 0.065, 64, 12, 2, 3),
            new THREE.MeshPhysicalMaterial({ color: 0x34d399, roughness: 0.25, metalness: 0.2, clearcoat: 0.8 })
          );
          pod.add(proteinKnot);
        } else if (idx === 3) {
          // 生成胆汁：翠绿胆囊 + 胆管排胆乳化脂肪
          const gb = new THREE.Mesh(
            new THREE.SphereGeometry(0.24, 20, 20),
            new THREE.MeshPhysicalMaterial({ color: 0x65a30d, roughness: 0.25, clearcoat: 0.9 })
          );
          gb.scale.set(0.85, 1.35, 0.85);
          gb.rotation.z = -0.4;
          pod.add(gb);
        }

        group.add(pod);

        // 管道内流动的定制几何粒子
        const pGeo = idx === 0
          ? new THREE.BoxGeometry(0.11, 0.11, 0.11) // 白色方糖晶体
          : new THREE.SphereGeometry(0.08, 12, 12);
        const pMat = new THREE.MeshBasicMaterial({ color: idx === 0 ? 0xffffff : cfg.color });

        for (let k = 0; k < 10; k++) {
          const pm = new THREE.Mesh(pGeo, pMat);
          group.add(pm);
          pipelineParticles.push({
            mesh: pm,
            lineIdx: idx,
            curve,
            t: k / 10,
            speed: 0.0045
          });
        }

        registerLabel(3, new THREE.Vector3(cfg.endX, -1.15, 0.65), cfg.name, cfg.sub, cfg.hex, () => selectCard(idx));
      });

      registerLabel(3, new THREE.Vector3(0, 1.65, 0.85), "⚙️ 代谢中枢反应堆", "1吃进去→2先过肝→3被分拣→4再入血", "#ffd166", () => {
        appState.scene4ActiveLine = -1;
      });

      sceneGroups.push(group);
      scene.add(group);

      sceneAnimators.push((time) => {
        gearRing1.rotation.z = time * 0.6;
        gearRing2.rotation.z = -time * 0.9;

        const activeIdx = appState.scene4ActiveLine;
        pipelineMeshes.forEach((m, idx) => {
          m.material.opacity = (activeIdx === -1 || activeIdx === idx) ? 0.62 : 0.15;
        });

        pipelineParticles.forEach(p => {
          const isFocused = (activeIdx === -1 || activeIdx === p.lineIdx);
          p.t = (p.t + p.speed * (isFocused ? 1.4 : 0.35)) % 1.0;
          p.mesh.position.copy(p.curve.getPointAt(p.t));
          p.mesh.rotation.x += 0.05;
          p.mesh.rotation.y += 0.05;
          p.mesh.visible = isFocused;
        });
      });
    }

    // ----------------------------------------------------------------------------
    // 构建场景 ⑤：肝脏不是单独工作（中央肝脏 + 六大协同器官网络）
    // ----------------------------------------------------------------------------
    function buildScene5() {
      const group = new THREE.Group();
      group.visible = false;

      // 1. 中央代谢中枢：3D 肝脏 + 胆囊 + 科技感协同光环
      const centerLiver = new THREE.Mesh(
        createAnatomicalLiverGeometry(),
        new THREE.MeshPhysicalMaterial({
          color: 0xa12b22,
          roughness: 0.35,
          clearcoat: 0.8
        })
      );
      centerLiver.scale.setScalar(0.68);
      group.add(centerLiver);

      const orbitRing1 = new THREE.Mesh(
        new THREE.RingGeometry(1.75, 1.8, 64),
        new THREE.MeshBasicMaterial({ color: 0xf5b942, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
      );
      const orbitRing2 = new THREE.Mesh(
        new THREE.RingGeometry(3.25, 3.29, 80),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.22, side: THREE.DoubleSide })
      );
      group.add(orbitRing1, orbitRing2);

      // 2. 六大协同器官节点配置
      const organsConfig = [
        { name: "肠道｜输入", sub: "消化吸收 · 营养输入", pos: new THREE.Vector3(-2.85, 1.75, 0), color: 0xf39c12, hex: "#f39c12", dir: "in" },
        { name: "胰腺｜调糖", sub: "分泌胰岛素 · 调节血糖", pos: new THREE.Vector3(2.85, 1.75, 0), color: 0x3898ff, hex: "#3898ff", dir: "in" },
        { name: "胆囊｜储胆", sub: "储存胆汁 · 助力消化", pos: new THREE.Vector3(-3.3, 0.0, 0), color: 0x2ecc71, hex: "#2ecc71", dir: "out" },
        { name: "血液｜运输", sub: "运输营养 · 分配产物", pos: new THREE.Vector3(3.3, 0.0, 0), color: 0xe04f44, hex: "#e04f44", dir: "out" },
        { name: "肌肉｜消耗", sub: "消耗能量 · 维持运动", pos: new THREE.Vector3(-2.85, -1.75, 0), color: 0xa569ff, hex: "#a569ff", dir: "out" },
        { name: "肾脏｜排废", sub: "过滤代谢废物 · 排出体外", pos: new THREE.Vector3(2.85, -1.75, 0), color: 0x00d2d3, hex: "#00d2d3", dir: "out" }
      ];

      const organNodes = [];
      const synergyParticles = [];

      organsConfig.forEach((cfg, idx) => {
        const nodeGroup = new THREE.Group();
        nodeGroup.position.copy(cfg.pos);

        // 玻璃生物球舱外壳
        const bubble = new THREE.Mesh(
          new THREE.SphereGeometry(0.75, 32, 32),
          new THREE.MeshPhysicalMaterial({
            color: cfg.color,
            transparent: true,
            opacity: 0.2,
            roughness: 0.1,
            clearcoat: 1
          })
        );
        nodeGroup.add(bubble);

        // 各器官逼真微缩 3D 造型
        if (idx === 0) {
          // 肠道：盘绕粉橙色肠管
          const knot = new THREE.Mesh(
            new THREE.TorusKnotGeometry(0.3, 0.09, 48, 12, 2, 3),
            new THREE.MeshPhysicalMaterial({ color: 0xe77f75, roughness: 0.4, clearcoat: 0.6 })
          );
          nodeGroup.add(knot);
        } else if (idx === 1) {
          // 胰腺：金黄色颗粒状狭长腺体
          const panc = new THREE.Mesh(
            new THREE.ConeGeometry(0.24, 0.85, 16),
            new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.5, bumpMap: hepaticBumpTex, bumpScale: 0.05 })
          );
          panc.rotation.z = -Math.PI / 2.4;
          nodeGroup.add(panc);
        } else if (idx === 2) {
          // 胆囊：翠绿色梨形囊体+胆管
          const gb = new THREE.Mesh(
            new THREE.SphereGeometry(0.28, 24, 24),
            new THREE.MeshPhysicalMaterial({ color: 0x4d7c0f, roughness: 0.2, clearcoat: 0.9 })
          );
          gb.scale.set(0.85, 1.4, 0.85);
          gb.rotation.z = -0.35;
          nodeGroup.add(gb);
        } else if (idx === 3) {
          // 血液：半透明动脉血管 + 双凹圆盘红细胞群
          const vessel = new THREE.Mesh(
            new THREE.CylinderGeometry(0.26, 0.26, 0.82, 20, 1, true),
            new THREE.MeshPhysicalMaterial({ color: 0xef4444, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
          );
          vessel.rotation.z = Math.PI / 3;
          nodeGroup.add(vessel);
          for (let r = -1; r <= 1; r++) {
            const rbc = new THREE.Mesh(
              new THREE.SphereGeometry(0.14, 16, 16),
              new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 })
            );
            rbc.scale.set(1, 0.4, 1);
            rbc.position.set(r * 0.16, r * 0.1, 0.08);
            nodeGroup.add(rbc);
          }
        } else if (idx === 4) {
          // 肌肉：梭形红褐色横纹骨骼肌束
          const muscle = new THREE.Mesh(
            new THREE.SphereGeometry(0.32, 24, 24),
            new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.45 })
          );
          muscle.scale.set(1.5, 0.65, 0.65);
          muscle.rotation.z = 0.45;
          nodeGroup.add(muscle);
        } else if (idx === 5) {
          // 肾脏：蚕豆形红褐色肾脏
          const kidney = new THREE.Mesh(
            new THREE.SphereGeometry(0.32, 24, 24),
            new THREE.MeshPhysicalMaterial({ color: 0x881337, roughness: 0.35, clearcoat: 0.7 })
          );
          kidney.scale.set(0.85, 1.35, 0.75);
          nodeGroup.add(kidney);
        }

        group.add(nodeGroup);

        // 连接肝脏与该器官的弧形能量管道
        const midPoint = cfg.pos.clone().multiplyScalar(0.5);
        midPoint.z += 0.45;
        const pts = cfg.dir === "in"
          ? [cfg.pos.clone().multiplyScalar(0.76), midPoint, new THREE.Vector3(0, 0, 0.2)]
          : [new THREE.Vector3(0, 0, 0.2), midPoint, cfg.pos.clone().multiplyScalar(0.76)];

        const { mesh: tubeMesh, curve } = createPathTube(pts, 0.075, cfg.color, 0.45);
        group.add(tubeMesh);
        organNodes.push({ nodeGroup, tubeMesh });

        // 管道流动粒子
        const pGeo = new THREE.SphereGeometry(0.065, 10, 10);
        const pMat = new THREE.MeshBasicMaterial({ color: cfg.color });
        for (let k = 0; k < 7; k++) {
          const pm = new THREE.Mesh(pGeo, pMat);
          group.add(pm);
          synergyParticles.push({
            mesh: pm,
            organIdx: idx,
            curve,
            t: k / 7,
            speed: 0.0048
          });
        }

        registerLabel(4, cfg.pos.clone().add(new THREE.Vector3(0, -0.92, 0.2)), cfg.name, cfg.sub, cfg.hex, () => selectCard(idx));
      });

      registerLabel(4, new THREE.Vector3(0, 0.1, 0.9), "🌟 代谢中枢", "与六大器官实时协同", "#ffd166", () => {
        appState.scene5ActiveOrgan = -1;
      });

      sceneGroups.push(group);
      scene.add(group);

      sceneAnimators.push((time) => {
        orbitRing1.rotation.z = time * 0.25;
        orbitRing2.rotation.z = -time * 0.18;

        const activeIdx = appState.scene5ActiveOrgan;
        organNodes.forEach((item, idx) => {
          const isFocused = (activeIdx === -1 || activeIdx === idx);
          item.tubeMesh.material.opacity = isFocused ? 0.65 : 0.12;
          item.nodeGroup.scale.setScalar(isFocused ? 1.0 + Math.sin(time * 3 + idx) * 0.04 : 0.82);
        });

        synergyParticles.forEach(p => {
          const isFocused = (activeIdx === -1 || activeIdx === p.organIdx);
          p.t = (p.t + p.speed * (isFocused ? 1.35 : 0.3)) % 1.0;
          p.mesh.position.copy(p.curve.getPointAt(p.t));
          p.mesh.visible = isFocused;
        });
      });
    }

    // ----------------------------------------------------------------------------
    // 构建场景 ⑥：转氨酶正常 ≠ 肝脏没事（表面正常 vs 影像线索 vs 深层组织三大改变）
    // ----------------------------------------------------------------------------
    function buildScene6() {
      const group = new THREE.Group();
      group.visible = false;

      // 1. 外层肝脏包膜（在模式0「化验单表面正常」下完整不透明；在模式2「深层组织改变」下变为半透明透视）
      const outerGeo = createAnatomicalLiverGeometry();
      const outerMat = new THREE.MeshPhysicalMaterial({
        color: 0x9e2a22,
        roughness: 0.36,
        clearcoat: 0.78,
        bumpMap: hepaticBumpTex,
        bumpScale: 0.03,
        transparent: true,
        opacity: 0.42
      });
      const outerLiver = new THREE.Mesh(outerGeo, outerMat);
      group.add(outerLiver);

      // 2. 模式 ②：超声弹性成像（红黄绿蓝硬度热力图）与 CAP 脂肪定量全息扫描环
      const elastographyGeo = createAnatomicalLiverGeometry();
      const eCount = elastographyGeo.attributes.position.count;
      const eColors = new Float32Array(eCount * 3);
      const ePos = elastographyGeo.attributes.position;
      for (let i = 0; i < eCount; i++) {
        const x = ePos.getX(i);
        const y = ePos.getY(i);
        const c = new THREE.Color();
        // 模拟超声弹性成像伪彩：右叶及中心偏硬(红/黄)，边缘偏软(绿/蓝)
        const dist = Math.hypot(x - 0.3, y - 0.15);
        if (dist < 0.75) c.setHex(0xef4444);      // 红色硬度升高区
        else if (dist < 1.35) c.setHex(0xf59e0b); // 黄色中度弹性区
        else if (dist < 1.9) c.setHex(0x10b981);  // 绿色区
        else c.setHex(0x3b82f6);                  // 蓝色正常弹性区
        eColors[i * 3] = c.r;
        eColors[i * 3 + 1] = c.g;
        eColors[i * 3 + 2] = c.b;
      }
      elastographyGeo.setAttribute("color", new THREE.BufferAttribute(eColors, 3));
      const elastographyMesh = new THREE.Mesh(
        elastographyGeo,
        new THREE.MeshBasicMaterial({ vertexColors: true, wireframe: true, transparent: true, opacity: 0.65 })
      );
      elastographyMesh.scale.setScalar(1.015);
      group.add(elastographyMesh);

      // 全息超声扫描光环
      const scanRing = new THREE.Mesh(
        new THREE.RingGeometry(0.1, 2.35, 64),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.28, side: THREE.DoubleSide })
      );
      scanRing.rotation.y = Math.PI / 2;
      group.add(scanRing);

      // 3. 模式 ③：深层组织三大隐匿改变（脂肪堆积 + 炎症活动 + 早期纤维化）
      const deepLesionsGroup = new THREE.Group();

      // (a) 脂肪堆积（脂肪变性 - 金黄色大泡性脂肪滴簇）
      const fatGroup = new THREE.Group();
      const fatMat = new THREE.MeshPhysicalMaterial({
        color: 0xfacc15,
        emissive: 0xca8a04,
        emissiveIntensity: 0.25,
        roughness: 0.2,
        clearcoat: 1
      });
      const fatCoords = [
        [-0.8, 0.75, 0.65, 0.22], [-0.35, 0.9, 0.58, 0.25], [0.15, 0.82, 0.55, 0.21],
        [-1.15, 0.45, 0.72, 0.19], [-0.55, 0.52, 0.78, 0.24], [0.05, 0.48, 0.68, 0.18],
        [0.55, 0.62, 0.52, 0.20], [-0.25, 1.12, 0.35, 0.17]
      ];
      fatCoords.forEach(([x, y, z, r]) => {
        const drop = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), fatMat);
        drop.position.set(x, y, z);
        fatGroup.add(drop);
      });
      deepLesionsGroup.add(fatGroup);

      // (b) 炎症活动（肝细胞炎症 - 鲜红色脉冲炎症灶与白细胞浸润点）
      const inflamGroup = new THREE.Group();
      const inflamMat = new THREE.MeshStandardMaterial({
        color: 0xff2e4c,
        emissive: 0xe11d48,
        emissiveIntensity: 0.75,
        roughness: 0.3
      });
      const inflamCoords = [
        [0.35, -0.05, 0.75], [0.82, 0.12, 0.62], [-0.15, -0.22, 0.82], [0.58, -0.35, 0.65]
      ];
      inflamCoords.forEach(c => {
        const focus = new THREE.Mesh(new THREE.DodecahedronGeometry(0.18, 1), inflamMat);
        focus.position.set(...c);
        inflamGroup.add(focus);
      });
      deepLesionsGroup.add(inflamGroup);

      // (c) 早期纤维化（纤维组织增生 - 灰白色蜘蛛网状胶原纤维丝）
      const earlyFibGroup = new THREE.Group();
      const earlyFibMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.85 });
      for (let i = 0; i < 16; i++) {
        const pts = [];
        for (let s = 0; s <= 4; s++) {
          const t = s / 4;
          pts.push(new THREE.Vector3(
            -0.6 + t * 2.1,
            -0.75 + (i / 16) * 0.75 + Math.sin(i + s) * 0.14,
            0.65 * (1 - t * 0.3) + Math.cos(i * 1.5 + s) * 0.12
          ));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        earlyFibGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.018, 8, false), earlyFibMat));
      }
      deepLesionsGroup.add(earlyFibGroup);
      group.add(deepLesionsGroup);

      // 注册 3D 标签
      registerLabel(5, new THREE.Vector3(-0.35, 1.05, 0.85), "🟡 脂肪堆积 (脂肪变性)", "CAP值 278 dB/m 提示脂肪肝", "#facc15", () => selectCard(3));
      registerLabel(5, new THREE.Vector3(0.65, 0.0, 0.95), "🔴 炎症活动 (肝细胞炎症)", "隐匿慢性炎症浸润", "#ff2e4c", () => selectCard(3));
      registerLabel(5, new THREE.Vector3(0.45, -0.65, 0.85), "🕸️ 早期纤维化 (纤维增生)", "弹性成像硬度↑提示风险", "#e2e8f0", () => selectCard(2));
      registerLabel(5, new THREE.Vector3(-1.55, 0.05, 0.95), "✅ 化验单 ALT/AST 正常", "表面正常 ≠ 结构无损", "#2ecc71", () => selectCard(0));

      group.userData.updateDiagMode = (mode) => {
        appState.scene6DiagMode = mode;
        if (mode === 0) {
          // 化验单表面正常：肝脏外表看似完好不透明
          outerMat.opacity = 0.96;
          elastographyMesh.visible = false;
          scanRing.visible = false;
          deepLesionsGroup.visible = false;
        } else if (mode === 1) {
          // 影像检查发现线索：开启超声弹性伪彩热力图与扫描光环
          outerMat.opacity = 0.55;
          elastographyMesh.visible = true;
          scanRing.visible = true;
          deepLesionsGroup.visible = true;
        } else {
          // 肝脏组织深层改变：剥开包膜清晰透视三大病变
          outerMat.opacity = 0.34;
          elastographyMesh.visible = false;
          scanRing.visible = false;
          deepLesionsGroup.visible = true;
        }
      };
      group.userData.updateDiagMode(2);

      sceneGroups.push(group);
      scene.add(group);

      sceneAnimators.push((time) => {
        scanRing.position.x = Math.sin(time * 1.4) * 1.85;
        inflamGroup.children.forEach((m, idx) => {
          m.scale.setScalar(0.85 + Math.sin(time * 4.5 + idx) * 0.22);
        });
      });
    }

    // 初始化全部 6 个 3D 场景
    buildScene1();
    buildScene2();
    buildScene3();
    buildScene4();
    buildScene5();
    buildScene6();

    // ============================================================================
    // 4. UI 渲染、相机平滑插值过渡与交互逻辑
    // ============================================================================
    let camLerpState = {
      active: false,
      targetCamPos: new THREE.Vector3(0, 0.6, 9.2),
      targetLookAt: new THREE.Vector3(0, 0, 0)
    };

    function flyCameraTo(camPos, lookAtPos) {
      camLerpState.targetCamPos.set(camPos.x, camPos.y, camPos.z);
      camLerpState.targetLookAt.set(lookAtPos.x, lookAtPos.y, lookAtPos.z);
      camLerpState.active = true;
    }

    // 生成所有 3D 浮动标签 DOM 元素
    const labelElements = [];
    sceneLabels.forEach((list, sIdx) => {
      list.forEach((item) => {
        const el = document.createElement("div");
        el.className = "label-3d";
        el.innerHTML = `
          <span class="dot" style="background:${item.color}; color:${item.color}"></span>
          <span>${item.title}</span>
          <span class="sub">· ${item.sub}</span>
        `;
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          if (item.onClick) item.onClick();
        });
        labelsContainer.appendChild(el);
        labelElements.push({
          el,
          sceneIdx: sIdx,
          pos: item.pos
        });
      });
    });

    // 渲染左侧每个场景专属的交互控件区
    function renderCustomControls(sceneIdx) {
      const box = document.getElementById("ui-custom-controls");
      if (sceneIdx === 0) {
        box.innerHTML = `
          <div class="control-section-title">
            <span>拖动滑块：模拟损伤频率与结局</span>
            <span id="scar-pct-label" style="color:var(--accent-gold)">左右对照 (50%)</span>
          </div>
          <div class="slider-wrap">
            <div class="slider-labels">
              <span style="color:#2ecc71">🟢 偶发损伤 (再生修复)</span>
              <span style="color:#e04f44">🔴 反复损伤 (纤维化留疤)</span>
            </div>
            <input type="range" min="0" max="100" value="${appState.scene1ScarRatio * 100}" class="custom-slider" id="slider-scar" />
          </div>
        `;
        const slider = document.getElementById("slider-scar");
        const pctLabel = document.getElementById("scar-pct-label");
        slider.addEventListener("input", (e) => {
          const val = Number(e.target.value) / 100;
          appState.scene1ScarRatio = val;
          sceneGroups[0].userData.updateScarRatio(val);
          if (val < 0.25) pctLabel.textContent = "完美再生修复";
          else if (val > 0.75) pctLabel.textContent = "重度纤维化留疤";
          else pctLabel.textContent = `修复 vs 留疤 (${Math.round(val * 100)}%)`;
        });
      } else if (sceneIdx === 1) {
        box.innerHTML = `
          <div class="control-section-title"><span>筛选门静脉入肝物质流</span></div>
          <div class="mode-btn-grid">
            <button class="mode-btn ${appState.scene2Filter === 'all' ? 'active' : ''}" data-filter="all">
              <span class="badge-dot" style="background:#fff"></span>全部物质
            </button>
            <button class="mode-btn ${appState.scene2Filter === 'nutrient' ? 'active' : ''}" data-filter="nutrient">
              <span class="badge-dot" style="background:#f5b942"></span>营养颗粒
            </button>
            <button class="mode-btn ${appState.scene2Filter === 'drug' ? 'active' : ''}" data-filter="drug">
              <span class="badge-dot" style="background:#38bdf8"></span>口服药物
            </button>
            <button class="mode-btn ${appState.scene2Filter === 'toxin' ? 'active' : ''}" data-filter="toxin">
              <span class="badge-dot" style="background:#d946ef"></span>毒素拦截
            </button>
          </div>
        `;
        box.querySelectorAll(".mode-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            appState.scene2Filter = btn.dataset.filter;
            renderCustomControls(1);
          });
        });
      } else if (sceneIdx === 2) {
        box.innerHTML = `
          <div class="control-section-title"><span>切换肝细胞酒精代谢负荷</span></div>
          <div class="mode-btn-grid cols-1">
            <button class="mode-btn ${appState.scene3AlcoholLoad < 0.6 ? 'active' : ''}" data-load="0.3">
              <span class="badge-dot" style="background:#2ecc71"></span>小量慢饮 · ALDH 酶正常转化乙酸
            </button>
            <button class="mode-btn ${appState.scene3AlcoholLoad >= 0.6 ? 'active' : ''}" data-load="1.0">
              <span class="badge-dot" style="background:#e04f44"></span>⚠️ 长期/大量饮酒 · 乙醛蓄积与 ROS 自由基风暴
            </button>
          </div>
        `;
        box.querySelectorAll(".mode-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            appState.scene3AlcoholLoad = Number(btn.dataset.load);
            renderCustomControls(2);
          });
        });
      } else if (sceneIdx === 3) {
        box.innerHTML = `
          <div class="control-section-title"><span>点选聚焦四条核心代谢流水线</span></div>
          <div class="mode-btn-grid">
            <button class="mode-btn ${appState.scene4ActiveLine === 0 ? 'active' : ''}" data-line="0">
              <span class="badge-dot" style="background:#3898ff"></span>管血糖
            </button>
            <button class="mode-btn ${appState.scene4ActiveLine === 1 ? 'active' : ''}" data-line="1">
              <span class="badge-dot" style="background:#f5b942"></span>管脂肪
            </button>
            <button class="mode-btn ${appState.scene4ActiveLine === 2 ? 'active' : ''}" data-line="2">
              <span class="badge-dot" style="background:#2ecc71"></span>合成蛋白
            </button>
            <button class="mode-btn ${appState.scene4ActiveLine === 3 ? 'active' : ''}" data-line="3">
              <span class="badge-dot" style="background:#a569ff"></span>生成胆汁
            </button>
          </div>
        `;
        box.querySelectorAll(".mode-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.line);
            appState.scene4ActiveLine = (appState.scene4ActiveLine === idx) ? -1 : idx;
            if (appState.scene4ActiveLine !== -1) selectCard(idx);
            renderCustomControls(3);
          });
        });
      } else if (sceneIdx === 4) {
        box.innerHTML = `
          <div class="control-section-title"><span>点选查看肝脏与六大器官协同链路</span></div>
          <div class="mode-btn-grid cols-3">
            <button class="mode-btn ${appState.scene5ActiveOrgan === 0 ? 'active' : ''}" data-org="0">肠道输入</button>
            <button class="mode-btn ${appState.scene5ActiveOrgan === 1 ? 'active' : ''}" data-org="1">胰腺调糖</button>
            <button class="mode-btn ${appState.scene5ActiveOrgan === 2 ? 'active' : ''}" data-org="2">胆囊储胆</button>
            <button class="mode-btn ${appState.scene5ActiveOrgan === 3 ? 'active' : ''}" data-org="3">血液运输</button>
            <button class="mode-btn ${appState.scene5ActiveOrgan === 4 ? 'active' : ''}" data-org="4">肌肉消耗</button>
            <button class="mode-btn ${appState.scene5ActiveOrgan === 5 ? 'active' : ''}" data-org="5">肾脏排废</button>
          </div>
        `;
        box.querySelectorAll(".mode-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.org);
            appState.scene5ActiveOrgan = (appState.scene5ActiveOrgan === idx) ? -1 : idx;
            if (appState.scene5ActiveOrgan !== -1) selectCard(idx);
            renderCustomControls(4);
          });
        });
      } else if (sceneIdx === 5) {
        box.innerHTML = `
          <div class="control-section-title"><span>三层医学评估透视切换</span></div>
          <div class="mode-btn-grid cols-3">
            <button class="mode-btn ${appState.scene6DiagMode === 0 ? 'active' : ''}" data-diag="0">① 化验表面</button>
            <button class="mode-btn ${appState.scene6DiagMode === 1 ? 'active' : ''}" data-diag="1">② 弹性/CAP</button>
            <button class="mode-btn ${appState.scene6DiagMode === 2 ? 'active' : ''}" data-diag="2">③ 组织透视</button>
          </div>
          <div class="lab-sheet">
            <div class="lab-sheet-header">
              <span>📋 生化检查报告单</span>
              <span style="color:#16a34a">✔ ALT/AST正常</span>
            </div>
            <div class="lab-row head"><span>项目</span><span>结果</span><span>参考范围</span></div>
            <div class="lab-row"><span>ALT (U/L)</span><span class="lab-val-ok">28</span><span>9 - 50</span></div>
            <div class="lab-row"><span>AST (U/L)</span><span class="lab-val-ok">26</span><span>15 - 40</span></div>
            <div class="lab-row"><span>总胆红素 (μmol/L)</span><span>11.2</span><span>3.4 - 20.5</span></div>
            <div class="lab-row"><span>白蛋白 (g/L)</span><span>45.3</span><span>35 - 55</span></div>
            <div class="lab-row" style="border:none"><span>超声 CAP / 弹性</span><span style="color:#dc2626;font-weight:800">278 dB/m ↑</span><span>提示脂肪肝/纤维化</span></div>
          </div>
        `;
        box.querySelectorAll(".mode-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const mode = Number(btn.dataset.diag);
            sceneGroups[5].userData.updateDiagMode(mode);
            renderCustomControls(5);
          });
        });
      }
    }

    // 渲染右侧知识卡片流
    function renderRightCards(sceneIdx) {
      const rightPanel = document.getElementById("right-panel");
      const data = SCENES_DATA[sceneIdx];
      rightPanel.innerHTML = data.cards.map((card, i) => `
        <div class="step-card" data-card-idx="${i}" style="--card-color: ${card.color}">
          <div class="step-header">
            <div class="step-title-group">
              <span class="step-index">${card.idx}</span>
              <span class="step-title">${card.title}</span>
            </div>
            <span class="step-badge">${card.badge}</span>
          </div>
          <p class="step-desc">${card.desc}</p>
          <div class="step-tags">
            ${card.tags.map(t => `<span class="step-tag">${t}</span>`).join("")}
          </div>
        </div>
      `).join("");

      rightPanel.querySelectorAll(".step-card").forEach(el => {
        el.addEventListener("click", () => {
          selectCard(Number(el.dataset.cardIdx));
        });
      });
    }

    // 选中某张知识卡片并联动 3D 镜头与场景状态
    function selectCard(cardIdx) {
      const sIdx = appState.currentScene;
      const data = SCENES_DATA[sIdx];
      const card = data.cards[cardIdx];
      if (!card) return;

      document.querySelectorAll(".step-card").forEach((el, idx) => {
        el.classList.toggle("active", idx === cardIdx);
      });

      if (card.focusPos && card.targetPos) {
        flyCameraTo(card.focusPos, card.targetPos);
      }

      if (sIdx === 3) {
        appState.scene4ActiveLine = cardIdx;
        renderCustomControls(3);
      } else if (sIdx === 4) {
        appState.scene5ActiveOrgan = cardIdx;
        renderCustomControls(4);
      } else if (sIdx === 5 && typeof card.diagMode === "number") {
        sceneGroups[5].userData.updateDiagMode(card.diagMode);
        renderCustomControls(5);
      }
    }

    // 切换主场景
    function switchScene(sceneIdx) {
      const targetIdx = (sceneIdx + SCENES_DATA.length) % SCENES_DATA.length;
      appState.currentScene = targetIdx;
      const data = SCENES_DATA[targetIdx];

      // 切换 3D 组可见性
      sceneGroups.forEach((g, idx) => {
        g.visible = (idx === targetIdx);
      });

      // 更新顶部导航高亮
      document.querySelectorAll(".nav-tab").forEach((tab, idx) => {
        tab.classList.toggle("active", idx === targetIdx);
      });
      document.getElementById("scene-counter").textContent = `场景 ${targetIdx + 1} / 6`;

      // 更新左侧与底部文案
      document.getElementById("ui-scene-tag").textContent = data.tag;
      document.getElementById("ui-scene-title").textContent = data.title;
      document.getElementById("ui-scene-subtitle").textContent = data.subtitle;
      document.getElementById("ui-slogan-main").textContent = data.sloganMain;
      document.getElementById("ui-slogan-sub").textContent = data.sloganSub;

      // 重置子状态并渲染面板
      appState.scene4ActiveLine = -1;
      appState.scene5ActiveOrgan = -1;
      renderCustomControls(targetIdx);
      renderRightCards(targetIdx);

      // 平滑飞行相机至该场景最佳机位
      flyCameraTo(data.camPos, data.camTarget);
    }

    // 绑定顶部导航与底部按钮事件
    document.querySelectorAll(".nav-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        switchScene(Number(btn.dataset.scene));
      });
    });

    document.getElementById("btn-prev").addEventListener("click", () => {
      switchScene(appState.currentScene - 1);
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      switchScene(appState.currentScene + 1);
    });

    document.getElementById("btn-reset-cam").addEventListener("click", () => {
      const data = SCENES_DATA[appState.currentScene];
      appState.scene4ActiveLine = -1;
      appState.scene5ActiveOrgan = -1;
      renderCustomControls(appState.currentScene);
      flyCameraTo(data.camPos, data.camTarget);
    });

    const btnAutoRotate = document.getElementById("btn-autorotate");
    btnAutoRotate.addEventListener("click", () => {
      controls.autoRotate = !controls.autoRotate;
      btnAutoRotate.classList.toggle("active", controls.autoRotate);
    });

    const btnToggleDrawer = document.getElementById("btn-toggle-drawer");
    const rightPanelEl = document.getElementById("right-panel");
    btnToggleDrawer.addEventListener("click", () => {
      rightPanelEl.classList.toggle("collapsed");
    });

    // 用户手动拖拽 3D 视图时打断相机自动飞行插值
    renderer.domElement.addEventListener("pointerdown", () => {
      camLerpState.active = false;
    });

    // 键盘数字键 1~6 快捷切换场景
    window.addEventListener("keydown", (e) => {
      if (e.key >= "1" && e.key <= "6") {
        switchScene(Number(e.key) - 1);
      }
    });

    // 窗口尺寸自适应
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 5. 渲染主循环与 3D 空间标签实时投影
    // ============================================================================
    const clock = new THREE.Clock();
    const tempProjVec = new THREE.Vector3();

    function update3DLabels() {
      const halfW = window.innerWidth / 2;
      const halfH = window.innerHeight / 2;

      labelElements.forEach(item => {
        if (item.sceneIdx !== appState.currentScene) {
          item.el.style.display = "none";
          return;
        }
        tempProjVec.copy(item.pos);
        tempProjVec.project(camera);

        // 判断是否在相机前方可视范围内
        if (tempProjVec.z > 1) {
          item.el.style.display = "none";
          return;
        }

        const x = (tempProjVec.x * halfW) + halfW;
        const y = -(tempProjVec.y * halfH) + halfH;
        item.el.style.display = "flex";
        item.el.style.left = `${x}px`;
        item.el.style.top = `${y}px`;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // 相机平滑过渡插值
      if (camLerpState.active) {
        camera.position.lerp(camLerpState.targetCamPos, 0.07);
        controls.target.lerp(camLerpState.targetLookAt, 0.07);
        if (
          camera.position.distanceTo(camLerpState.targetCamPos) < 0.03 &&
          controls.target.distanceTo(camLerpState.targetLookAt) < 0.03
        ) {
          camLerpState.active = false;
        }
      }

      // 执行当前激活场景的 3D 动画更新
      const activeAnimator = sceneAnimators[appState.currentScene];
      if (activeAnimator) activeAnimator(elapsedTime);

      controls.update();
      update3DLabels();
      renderer.render(scene, camera);
    }

    // 启动初始场景 ①
    switchScene(0);
    animate();
  </script>
</body>
</html>
