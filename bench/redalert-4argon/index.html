<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红色警戒：前线指挥官 (Canvas RTS)</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
  }
  #game-container {
    position: relative;
    flex: 1;
    height: 100vh;
    overflow: hidden;
    background: #000;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  /* 顶部状态栏 */
  #top-bar {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .hud-pill {
    background: rgba(12, 18, 28, 0.88);
    border: 1px solid #3b5998;
    box-shadow: 0 0 12px rgba(0, 180, 255, 0.25), inset 0 0 8px rgba(0, 120, 255, 0.15);
    border-radius: 6px;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    pointer-events: auto;
    font-size: 13px;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: bold;
  }
  .credits-val {
    color: #ffd700;
    font-size: 18px;
    font-family: Consolas, monospace;
    text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
  }
  .power-val {
    color: #4ade80;
    font-family: Consolas, monospace;
    font-size: 15px;
  }
  .power-val.low {
    color: #ff4d4f;
    animation: blink 0.8s infinite;
  }
  .wave-val {
    color: #ff7875;
    font-family: Consolas, monospace;
  }
  .top-btn {
    background: #1e293b;
    color: #cbd5e1;
    border: 1px solid #475569;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.15s;
  }
  .top-btn:hover {
    background: #334155;
    color: #fff;
    border-color: #60a5fa;
  }
  .top-btn.active {
    background: #991b1b;
    border-color: #f87171;
    color: #fff;
  }

  /* 底部指令与实时消息条 */
  #bottom-bar {
    position: absolute;
    bottom: 12px;
    left: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    z-index: 10;
  }
  #msg-log {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 460px;
  }
  .msg-item {
    background: rgba(10, 15, 25, 0.82);
    border-left: 3px solid #38bdf8;
    padding: 4px 10px;
    font-size: 12.5px;
    color: #e2e8f0;
    border-radius: 0 4px 4px 0;
    text-shadow: 1px 1px 2px #000;
    animation: fadeIn 0.2s ease-out;
  }
  .msg-item.warn { border-left-color: #f59e0b; color: #fde68a; }
  .msg-item.danger { border-left-color: #ef4444; color: #fecaca; }
  .msg-item.success { border-left-color: #22c55e; color: #bbf7d0; }

  #selection-panel {
    background: rgba(12, 18, 28, 0.9);
    border: 1px solid #3b5998;
    border-radius: 6px;
    padding: 8px 14px;
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 360px;
  }
  #sel-info {
    flex: 1;
    font-size: 13px;
  }
  #sel-actions {
    display: flex;
    gap: 6px;
  }
  .cmd-btn {
    background: linear-gradient(180deg, #1e3a8a 0%, #172554 100%);
    border: 1px solid #3b82f6;
    color: #fff;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-weight: bold;
  }
  .cmd-btn:hover {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
  }
  .cmd-btn.deploy-highlight {
    background: linear-gradient(180deg, #d97706 0%, #92400e 100%);
    border-color: #fbbf24;
    animation: pulseBtn 1.2s infinite;
  }

  /* 右侧红警经典控制栏 */
  #sidebar {
    width: 270px;
    height: 100vh;
    background: linear-gradient(180deg, #161d2a 0%, #0f141d 100%);
    border-left: 3px solid #2e4369;
    display: flex;
    flex-direction: column;
    z-index: 20;
    box-shadow: -4px 0 18px rgba(0, 0, 0, 0.7);
  }
  .sidebar-header {
    background: linear-gradient(90deg, #8b0000 0%, #4a0404 100%);
    padding: 8px 12px;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    border-bottom: 2px solid #b91c1c;
    color: #fef08a;
    text-shadow: 0 1px 3px #000;
  }
  /* 雷达小地图区 */
  #minimap-wrap {
    padding: 10px;
    background: #0b0f17;
    border-bottom: 2px solid #263552;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  #minimapCanvas {
    width: 220px;
    height: 220px;
    border: 2px solid #3b5998;
    background: #05070b;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
  }
  .minimap-tip {
    font-size: 11px;
    color: #64748b;
    margin-top: 4px;
  }
  /* 电力柱状条 + 生产页签 */
  #power-bar-wrap {
    padding: 6px 12px;
    background: #111827;
    border-bottom: 1px solid #1f2937;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .power-track {
    flex: 1;
    height: 10px;
    background: #1f2937;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid #374151;
    position: relative;
  }
  #power-fill {
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    transition: width 0.3s, background 0.3s;
  }
  /* 建造队列区域 */
  #build-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px;
    overflow-y: auto;
    gap: 10px;
  }
  .section-title {
    font-size: 12px;
    color: #93c5fd;
    font-weight: bold;
    border-bottom: 1px solid #263552;
    padding-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .build-card {
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border: 1px solid #334155;
    border-radius: 5px;
    padding: 7px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 66px;
  }
  .build-card:hover:not(.locked) {
    border-color: #60a5fa;
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
  }
  .build-card.locked {
    opacity: 0.42;
    cursor: not-allowed;
    filter: grayscale(0.7);
  }
  .build-card.ready {
    border-color: #fbbf24;
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.55);
    animation: pulseReady 1s infinite;
  }
  .build-card .c-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    font-weight: bold;
    color: #f8fafc;
    z-index: 2;
  }
  .build-card .c-cost {
    color: #fbbf24;
    font-family: Consolas, monospace;
    font-size: 12px;
    z-index: 2;
  }
  .build-card .c-desc {
    font-size: 10.5px;
    color: #94a3b8;
    margin-top: 3px;
    z-index: 2;
  }
  .build-card .progress-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: rgba(37, 99, 235, 0.38);
    pointer-events: none;
    z-index: 1;
  }
  .build-card .status-badge {
    position: absolute;
    right: 6px;
    bottom: 5px;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(0, 0, 0, 0.75);
    color: #fde047;
    z-index: 3;
    display: none;
  }

  /* 快捷键提示底栏 */
  #hotkey-footer {
    padding: 8px 10px;
    background: #090d14;
    border-top: 1px solid #1e293b;
    font-size: 11px;
    color: #94a3b8;
    line-height: 1.5;
  }
  kbd {
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 3px;
    padding: 0 4px;
    color: #e2e8f0;
    font-family: Consolas, monospace;
    font-size: 10.5px;
  }

  /* 胜负弹窗与说明弹窗 */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-box {
    background: linear-gradient(180deg, #172030 0%, #0c111b 100%);
    border: 2px solid #3b82f6;
    border-radius: 8px;
    padding: 28px 34px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    box-shadow: 0 0 35px rgba(37, 99, 235, 0.4);
  }
  .modal-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .modal-desc {
    color: #cbd5e1;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 22px;
    text-align: left;
  }
  .modal-btn {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    border: 1px solid #60a5fa;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    padding: 10px 26px;
    border-radius: 6px;
    cursor: pointer;
  }
  .modal-btn:hover {
    filter: brightness(1.15);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes pulseReady {
    0%, 100% { box-shadow: 0 0 6px rgba(251, 191, 36, 0.4); }
    50% { box-shadow: 0 0 16px rgba(251, 191, 36, 0.95); }
  }
  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>

<!-- 主战场区域 -->
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <!-- 顶部资源与控制栏 -->
  <div id="top-bar">
    <div class="hud-pill">
      <div class="stat-item">
        <span>💰 资金:</span>
        <span id="ui-credits" class="credits-val">$5000</span>
      </div>
      <div class="stat-item">
        <span>⚡ 电力:</span>
        <span id="ui-power" class="power-val">0 / 0</span>
      </div>
      <div class="stat-item">
        <span>🛡️ 我方兵力:</span>
        <span id="ui-pop" style="color:#60a5fa;">4</span>
      </div>
      <div class="stat-item">
        <span>🚨 敌军攻势:</span>
        <span id="ui-wave" class="wave-val">第 1 波 (45s)</span>
      </div>
    </div>

    <div class="hud-pill" style="gap: 8px;">
      <button id="btn-attack-move" class="top-btn" title="快捷键 A：点击地面后沿途自动攻击敌人">⚔️ 攻击移动 (A)</button>
      <button id="btn-home" class="top-btn" title="快捷键 H：镜头回到我方主基地">🏠 回到基地 (H)</button>
      <button id="btn-fog" class="top-btn" title="切换战争迷雾开关（调试/观察AI）">🌫️ 迷雾: 开</button>
      <button id="btn-sound" class="top-btn" title="开关合成音效与语音">🔊 音效: 开</button>
      <button id="btn-help" class="top-btn">📖 玩法说明</button>
      <button id="btn-restart" class="top-btn">🔄 重开</button>
    </div>
  </div>

  <!-- 左下角战地消息与选中面板 -->
  <div id="bottom-bar">
    <div id="msg-log"></div>
    <div id="selection-panel">
      <div id="sel-info">未选中单位 — 左键点选或拖拽框选，右键下达指令</div>
      <div id="sel-actions"></div>
    </div>
  </div>
</div>

<!-- 右侧红警经典侧边栏 -->
<div id="sidebar">
  <div class="sidebar-header">★ 盟军战地指挥系统 ★</div>

  <!-- 雷达小地图 -->
  <div id="minimap-wrap">
    <canvas id="minimapCanvas" width="220" height="220"></canvas>
    <div class="minimap-tip">小地图：左键拖拽镜头 | 右键移动部队</div>
  </div>

  <!-- 电力负载条 -->
  <div id="power-bar-wrap">
    <span>⚡ 负载</span>
    <div class="power-track">
      <div id="power-fill"></div>
    </div>
    <span id="power-status-txt" style="color:#4ade80;font-weight:bold;">正常</span>
  </div>

  <!-- 建造与生产面板 -->
  <div id="build-section">
    <div>
      <div class="section-title">
        <span>🏗️ 基地建筑 (需建造厂)</span>
        <span id="bldg-queue-hint" style="color:#fbbf24;"></span>
      </div>
      <div id="building-grid" class="card-grid" style="margin-top:6px;"></div>
    </div>

    <div>
      <div class="section-title">
        <span>🎖️ 作战单位 (兵营/车厂)</span>
        <span id="unit-queue-hint" style="color:#38bdf8;"></span>
      </div>
      <div id="unit-grid" class="card-grid" style="margin-top:6px;"></div>
    </div>
  </div>

  <div id="hotkey-footer">
    <div><kbd>左键</kbd> 点选/框选/放置建筑 | <kbd>右键</kbd> 移动/攻击/采矿/取消</div>
    <div><kbd>双击基地车</kbd> 或 <kbd>D</kbd> 展开基地 | <kbd>WASD</kbd>/<kbd>方向键</kbd> 移动镜头</div>
    <div><kbd>A</kbd> 攻击移动 | <kbd>S</kbd> 停止 | <kbd>H</kbd> 回基地 | <kbd>双击单位</kbd> 全选同类</div>
  </div>
</div>

<!-- 胜负结算与帮助弹窗 -->
<div id="modal-overlay" class="modal-backdrop">
  <div class="modal-box">
    <div id="modal-title" class="modal-title" style="color:#fbbf24;">作战简报</div>
    <div id="modal-body" class="modal-desc"></div>
    <button id="modal-close-btn" class="modal-btn">立即投入战斗</button>
  </div>
</div>

<script>
(() => {
  // ==========================================
  // 1. 全局配置与数据结构定义
  // ==========================================
  const TILE_SIZE = 40;
  const MAP_COLS = 60;
  const MAP_ROWS = 60;
  const WORLD_W = MAP_COLS * TILE_SIZE; // 2400
  const WORLD_H = MAP_ROWS * TILE_SIZE; // 2400

  const TEAM_PLAYER = 1;
  const TEAM_ENEMY = 2;

  // 建筑配置表
  const BUILDING_DEFS = {
    yard: {
      id: 'yard', name: '建造厂', cost: 0, power: 20, hp: 1600,
      w: 3, h: 3, sight: 320, buildTime: 0,
      desc: '核心指挥中枢，解锁建筑建造',
      req: []
    },
    power: {
      id: 'power', name: '发电厂', cost: 600, power: 100, hp: 750,
      w: 2, h: 2, sight: 220, buildTime: 5,
      desc: '提供 +100 电力支持基地运转',
      req: ['yard']
    },
    refinery: {
      id: 'refinery', name: '矿石精炼厂', cost: 1500, power: -30, hp: 1100,
      w: 3, h: 2, sight: 260, buildTime: 8,
      desc: '附赠1辆采矿车，卸载矿石换取资金',
      req: ['yard', 'power']
    },
    barracks: {
      id: 'barracks', name: '兵营', cost: 500, power: -20, hp: 850,
      w: 2, h: 2, sight: 250, buildTime: 6,
      desc: '训练动员兵与重装火箭兵',
      req: ['yard', 'power']
    },
    factory: {
      id: 'factory', name: '战车工厂', cost: 1800, power: -50, hp: 1300,
      w: 3, h: 3, sight: 280, buildTime: 10,
      desc: '生产坦克、采矿车与基地车',
      req: ['yard', 'refinery', 'barracks']
    },
    turret: {
      id: 'turret', name: '光棱防御塔', cost: 800, power: -40, hp: 800,
      w: 1, h: 1, sight: 310, buildTime: 6,
      range: 270, damage: 52, fireRate: 1.3,
      desc: '强力激光基地防御，需充足电力',
      req: ['yard', 'power']
    }
  };

  // 单位配置表
  const UNIT_DEFS = {
    mcv: {
      id: 'mcv', name: '基地车(MCV)', cost: 2000, hp: 1000, speed: 58,
      radius: 20, sight: 260, buildTime: 12,
      damage: 0, range: 0, fireRate: 0,
      producer: 'factory', req: ['factory'],
      desc: '双击或按D展开为建造厂'
    },
    harvester: {
      id: 'harvester', name: '武装采矿车', cost: 1000, hp: 850, speed: 68,
      radius: 17, sight: 230, buildTime: 8,
      damage: 0, range: 0, fireRate: 0, maxCargo: 700,
      producer: 'factory', req: ['factory', 'refinery'],
      desc: '自动往返矿区与精炼厂采集资金'
    },
    rifle: {
      id: 'rifle', name: '动员兵', cost: 150, hp: 130, speed: 88,
      radius: 9, sight: 220, buildTime: 3,
      damage: 14, range: 145, fireRate: 0.55, bulletType: 'bullet',
      producer: 'barracks', req: ['barracks'],
      desc: '廉价快速步兵，擅长压制轻甲'
    },
    rocket: {
      id: 'rocket', name: '重装火箭兵', cost: 300, hp: 160, speed: 74,
      radius: 10, sight: 245, buildTime: 4.5,
      damage: 38, range: 205, fireRate: 1.25, bulletType: 'missile',
      producer: 'barracks', req: ['barracks'],
      desc: '发射穿甲火箭，装甲与建筑克星'
    },
    tank: {
      id: 'tank', name: '犀牛主战坦克', cost: 700, hp: 520, speed: 78,
      radius: 16, sight: 265, buildTime: 6.5,
      damage: 46, range: 215, fireRate: 1.15, bulletType: 'shell',
      producer: 'factory', req: ['factory'],
      desc: '攻守兼备的主力装甲集群核心'
    },
    prism: {
      id: 'prism', name: '光棱坦克', cost: 1200, hp: 380, speed: 66,
      radius: 17, sight: 310, buildTime: 9,
      damage: 85, range: 295, fireRate: 1.85, bulletType: 'laser',
      producer: 'factory', req: ['factory'],
      desc: '超远射程高能光束，攻城拔寨神器'
    }
  };

  // ==========================================
  // 2. Web Audio 纯代码音效与中文 EVA 播报
  // ==========================================
  class SoundSystem {
    constructor() {
      this.enabled = true;
      this.ctx = null;
      this.lastSpeakTime = 0;
    }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }
    play(type) {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      if (type === 'rifle') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.06);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'cannon') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.18);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'laser') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(980, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.22);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'boom') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(95, now);
        osc.frequency.exponentialRampToValueAtTime(22, now + 0.32);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.32);
        osc.start(now);
        osc.stop(now + 0.32);
      } else if (type === 'cash') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1320, now + 0.07);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
        osc.start(now);
        osc.stop(now + 0.04);
      }
    }
    speak(text) {
      if (!this.enabled || !('speechSynthesis' in window)) return;
      const now = performance.now();
      if (now - this.lastSpeakTime < 1600) return;
      this.lastSpeakTime = now;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 1.15;
        u.volume = 0.7;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
  }
