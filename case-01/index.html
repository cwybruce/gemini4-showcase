<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自媒体从 0 到 100 万粉完整打法 | 交互式 2D 动画图解</title>
<style>
  :root {
    --bg-main: #090d16;
    --bg-card: #111827;
    --bg-panel: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-cyan: #06b6d4;
    --accent-blue: #3b82f6;
    --accent-amber: #f59e0b;
    --accent-rose: #f43f5e;
    --accent-emerald: #10b981;
    --accent-purple: #8b5cf6;
    --border-color: #334155;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部导航栏 */
  header {
    height: 64px;
    background: rgba(17, 24, 39, 0.9);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-badge {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }

  .brand-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
  }

  .step-nav {
    display: flex;
    gap: 6px;
  }

  .step-dot {
    padding: 6px 12px;
    border-radius: 6px;
    background: var(--bg-panel);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.25s ease;
  }

  .step-dot:hover {
    color: var(--text-main);
    border-color: var(--border-color);
  }

  .step-dot.active {
    background: rgba(6, 182, 212, 0.15);
    color: var(--accent-cyan);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    background: var(--bg-panel);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    background: #334155;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    border-color: transparent;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  /* 主体区域 */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 390px;
    overflow: hidden;
  }

  /* 左侧 SVG 动画舞台 */
  .stage-container {
    position: relative;
    background: radial-gradient(circle at 50% 50%, #131c31 0%, #090d16 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  .scene {
    width: 100%;
    height: 100%;
    max-width: 1050px;
    max-height: 680px;
    display: none;
    animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .scene.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* 右侧深度逻辑解析面板 */
  .sidebar {
    background: var(--bg-card);
    border-left: 1px solid var(--border-color);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-y: auto;
  }

  .chapter-tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--accent-amber);
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.3);
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 12px;
  }

  .chapter-title {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 16px;
    color: #fff;
  }

  .chapter-quote {
    background: rgba(30, 41, 59, 0.7);
    border-left: 3px solid var(--accent-cyan);
    padding: 12px 14px;
    border-radius: 0 8px 8px 0;
    font-size: 13.5px;
    color: #e2e8f0;
    line-height: 1.6;
    margin-bottom: 20px;
    font-style: italic;
  }

  .logic-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .logic-item {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .logic-item-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-cyan);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .logic-item-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.55;
  }

  .sidebar-footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* SVG 内部动画通用样式 */
  .svg-card {
    fill: #111827;
    stroke: #334155;
    stroke-width: 1.5;
  }

  .flow-line {
    fill: none;
    stroke-dasharray: 8 6;
    animation: flowDash 1.2s linear infinite;
  }

  @keyframes flowDash {
    to { stroke-dashoffset: -28; }
  }

  .pulse-node {
    transform-origin: center;
    animation: pulseGlow 2.4s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
  }

  .float-slow {
    animation: floatY 3.5s ease-in-out infinite;
  }

  .float-delayed {
    animation: floatY 3.5s ease-in-out 1.75s infinite;
  }

  @keyframes floatY {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-7px); }
  }

  .spin-gear {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .seesaw-beam {
    transform-origin: 450px 300px;
    animation: tiltBeam 5s ease-in-out infinite;
  }

  @keyframes tiltBeam {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }

  /* 进度条 */
  .progress-bar {
    height: 3px;
    background: var(--bg-panel);
    width: 100%;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-emerald));
    width: 16.66%;
    transition: width 0.3s ease;
  }

  @media (max-width: 1024px) {
    main {
      grid-template-columns: 1fr;
      grid-template-rows: 58% 42%;
    }
    .sidebar {
      border-left: none;
      border-top: 1px solid var(--border-color);
    }
    .brand-title { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-badge">0 → 100W 粉丝</span>
    <span class="brand-title">自媒体底层破局与商业全案 · 2D 动态逻辑图解</span>
  </div>

  <div class="step-nav" id="stepNav">
    <button class="step-dot active" onclick="goToScene(0)">01. A/B问题分流</button>
    <button class="step-dot" onclick="goToScene(1)">02. 全平台与ROI</button>
    <button class="step-dot" onclick="goToScene(2)">03. 选赛道双引擎</button>
    <button class="step-dot" onclick="goToScene(3)">04. 观点原创工程</button>
    <button class="step-dot" onclick="goToScene(4)">05. 利他与换框架</button>
    <button class="step-dot" onclick="goToScene(5)">06. 议程设置闭环</button>
  </div>

  <div class="controls">
    <button class="btn" onclick="prevScene()">◀ 上一幕</button>
    <button class="btn btn-primary" id="autoPlayBtn" onclick="toggleAutoPlay()">▶ 自动巡演</button>
    <button class="btn" onclick="nextScene()">下一幕 ▶</button>
  </div>
</header>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<main>
  <!-- 左侧 SVG 2D 动画舞台 -->
  <div class="stage-container">

    <!-- ==================== 第 1 幕：A类与B类问题分流器 ==================== -->
    <div class="scene active" id="scene-0">
      <svg viewBox="0 0 900 560">
        <defs>
          <linearGradient id="gradCyan" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
          <linearGradient id="gradRose" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#e11d48"/>
          </linearGradient>
          <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
          </marker>
          <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
          </marker>
        </defs>

        <!-- 标题 -->
        <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">破局第一步：拒绝“四处漏风”，先给问题做 A/B 分类</text>
        <text x="450" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">两年 7-8 个平台涨粉 100 万的起点：区分“决定生死的方向问题”与“边干边摸索的琐碎细节”</text>

        <!-- 左侧：四处漏风的墙（新手混沌期） -->
        <g transform="translate(40, 130)">
          <rect x="0" y="0" width="210" height="330" rx="12" fill="#161f33" stroke="#475569" stroke-width="2" stroke-dasharray="10 5"/>
          <text x="105" y="34" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">🧱 新手脑海：四处漏风的墙</text>
          <text x="105" y="54" text-anchor="middle" fill="#94a3b8" font-size="11">无穷无尽的窟窿，不知先堵哪一个</text>

          <!-- 窟窿气泡 -->
          <g class="float-slow">
            <rect x="20" y="75" width="170" height="34" rx="6" fill="#1e293b" stroke="#64748b"/>
            <text x="105" y="96" text-anchor="middle" fill="#cbd5e1" font-size="12">❓ 我拍视频到底该讲什么？</text>
          </g>
          <g class="float-delayed">
            <rect x="20" y="120" width="170" height="34" rx="6" fill="#1e293b" stroke="#64748b"/>
            <text x="105" y="141" text-anchor="middle" fill="#cbd5e1" font-size="12">❓ 虚拟知识付费还是实体供应链？</text>
          </g>
          <g class="float-slow">
            <rect x="20" y="165" width="170" height="34" rx="6" fill="#1e293b" stroke="#64748b"/>
            <text x="105" y="186" text-anchor="middle" fill="#cbd5e1" font-size="12">❓ 我要不要露脸？发哪个平台？</text>
          </g>
          <g class="float-delayed">
            <rect x="20" y="210" width="170" height="34" rx="6" fill="#1e293b" stroke="#64748b"/>
            <text x="105" y="231" text-anchor="middle" fill="#cbd5e1" font-size="12">❓ 手机横拍竖拍？买大疆加滤镜？</text>
          </g>
          <g class="float-slow">
            <rect x="20" y="255" width="170" height="34" rx="6" fill="#1e293b" stroke="#64748b"/>
            <text x="105" y="276" text-anchor="middle" fill="#cbd5e1" font-size="12">❓ 麦克风左右声道？GPT剪辑？</text>
          </g>
        </g>

        <!-- 中间：认知分流漏斗 -->
        <g transform="translate(295, 225)">
          <polygon points="0,20 95,0 95,140 0,120" fill="url(#gradCyan)" opacity="0.2" stroke="#06b6d4" stroke-width="2"/>
          <circle cx="48" cy="70" r="28" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
          <text x="48" y="66" text-anchor="middle" fill="#06b6d4" font-size="12" font-weight="800">核心</text>
          <text x="48" y="82" text-anchor="middle" fill="#06b6d4" font-size="12" font-weight="800">分流器</text>
        </g>

        <!-- 动画连线：上半支流（A类问题） -->
        <path d="M 250 265 L 295 275" stroke="#94a3b8" stroke-width="2" class="flow-line"/>
        <path d="M 390 260 C 440 260, 440 185, 500 185" stroke="#06b6d4" stroke-width="3" class="flow-line" marker-end="url(#arrowCyan)"/>

        <!-- 动画连线：下半支流（B类问题） -->
        <path d="M 390 330 C 440 330, 440 410, 500 410" stroke="#f43f5e" stroke-width="3" class="flow-line" marker-end="url(#arrowRose)"/>

        <!-- 右上：A类问题（战略主干道） -->
        <g transform="translate(510, 100)">
          <rect x="0" y="0" width="350" height="175" rx="12" fill="#0f293a" stroke="#06b6d4" stroke-width="2"/>
          <rect x="16" y="14" width="90" height="24" rx="4" fill="#06b6d4"/>
          <text x="61" y="30" text-anchor="middle" fill="#090d16" font-size="12" font-weight="800">A 类问题 · 必答</text>
          <text x="120" y="30" fill="#e2e8f0" font-size="13" font-weight="700">不知道答案 = 压根没法开工 / 踩大坑</text>

          <g transform="translate(16, 52)">
            <rect x="0" y="0" width="100" height="58" rx="6" fill="#164e63" stroke="#22d3ee"/>
            <text x="50" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1. 平台策略</text>
            <text x="50" y="44" text-anchor="middle" fill="#a5f3fc" font-size="11">全平台发 vs 单一</text>

            <rect x="109" y="0" width="100" height="58" rx="6" fill="#164e63" stroke="#22d3ee"/>
            <text x="159" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2. 赛道方向</text>
            <text x="159" y="44" text-anchor="middle" fill="#a5f3fc" font-size="11">找对标 vs 强表达</text>

            <rect x="218" y="0" width="100" height="58" rx="6" fill="#164e63" stroke="#22d3ee"/>
            <text x="268" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3. 观点与框架</text>
            <text x="268" y="44" text-anchor="middle" fill="#a5f3fc" font-size="11">原创素材+利他钩子</text>
          </g>

          <rect x="16" y="124" width="318" height="34" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
          <text x="175" y="145" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">🚀 解决 A 类问题 → 直接跑通从 0 到 100 万粉主干道</text>
        </g>

        <!-- 右下：B类问题（内耗死循环） -->
        <g transform="translate(510, 315)">
          <rect x="0" y="0" width="350" height="190" rx="12" fill="#2a121d" stroke="#f43f5e" stroke-width="2"/>
          <rect x="16" y="14" width="90" height="24" rx="4" fill="#f43f5e"/>
          <text x="61" y="30" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">B 类问题 · 忽略</text>
          <text x="120" y="30" fill="#fecdd3" font-size="13" font-weight="700">给 1000 小时也答不完的无底洞细节</text>

          <!-- 旋转内耗齿轮 -->
          <g transform="translate(65, 105)">
            <circle cx="0" cy="0" r="34" fill="none" stroke="#f43f5e" stroke-width="4" stroke-dasharray="10 6" class="spin-gear"/>
            <text x="0" y="-4" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="700">内耗</text>
            <text x="0" y="12" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="700">3个月~5年</text>
          </g>

          <g transform="translate(120, 56)">
            <text x="0" y="18" fill="#fda4af" font-size="12">• 纠结横竖屏、买大疆、套滤镜</text>
            <text x="0" y="40" fill="#fda4af" font-size="12">• 研究怎么用 GPT 自动剪辑提效</text>
            <text x="0" y="62" fill="#fda4af" font-size="12">• 麦克风左右声道不一致怎么办</text>
            <rect x="0" y="76" width="214" height="40" rx="6" fill="rgba(244, 63, 94, 0.25)" stroke="#f43f5e"/>
            <text x="107" y="94" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">⚠️ 典型症状：主页发不到 10 个视频</text>
            <text x="107" y="110" text-anchor="middle" fill="#fecdd3" font-size="11">解法：先上马开干，在实操中顺手解决</text>
          </g>
        </g>
      </svg>
    </div>

    <!-- ==================== 第 2 幕：全平台分发与商业模式壁垒 ==================== -->
    <div class="scene" id="scene-1">
      <svg viewBox="0 0 900 560">
        <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800">平台分发铁律：99%的人必须全平台一起发（一鱼多吃）</text>
        <text x="450" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">不发某平台绝不是“流量或人群调性问题”，而是“商业模式与投产比（ROI）问题”</text>

        <!-- 中心源头：一条母视频 -->
        <g transform="translate(90, 215)">
          <rect x="0" y="0" width="160" height="120" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="2.5"/>
          <text x="80" y="42" text-anchor="middle" fill="#06b6d4" font-size="15" font-weight="800">🎬 1 条核心视频</text>
          <text x="80" y="66" text-anchor="middle" fill="#cbd5e1" font-size="12">既然做都做了</text>
          <text x="80" y="86" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">全网同步一键分发</text>
        </g>

        <!-- 辐射连线 -->
        <path d="M 250 250 C 310 250, 320 135, 380 135" stroke="#06b6d4" stroke-width="2.5" class="flow-line"/>
        <path d="M 250 265 C 310 265, 320 235, 380 235" stroke="#10b981" stroke-width="2.5" class="flow-line"/>
        <path d="M 250 285 C 310 285, 320 340, 380 340" stroke="#f59e0b" stroke-width="2.5" class="flow-line"/>
        <path d="M 250 300 C 310 300, 320 445, 380 445" stroke="#f43f5e" stroke-width="2.5" class="flow-line"/>

        <!-- 平台节点列表 -->
        <!-- 1. 抖音 -->
        <g transform="translate(385, 95)">
          <rect x="0" y="0" width="465" height="78" rx="10" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
          <rect x="14" y="16" width="95" height="46" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4"/>
          <text x="61" y="44" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="800">抖音 / 快手</text>
          <text x="128" y="32" fill="#f8fafc" font-size="13" font-weight="700">中心化算法 · 靠选题与前 5 秒开头直接拉爆自然流</text>
          <text x="128" y="54" fill="#94a3b8" font-size="12">优势：允许公开介绍产品；缺点：同质化标品极易触发全网比价（98元 vs 95元）</text>
        </g>

        <!-- 2. 视频号 -->
        <g transform="translate(385, 195)">
          <rect x="0" y="0" width="465" height="78" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
          <rect x="14" y="16" width="95" height="46" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>

    const data = scenesData[index];
    const container = document.getElementById('sidebarContent');

    const pointsHtml = data.points.map(p => `
      <li class="logic-item">
        <div class="logic-item-title">✦ ${p.title}</div>
        <div class="logic-item-desc">${p.desc.replace(/\n/g, '<br>')}</div>
      </li>
    `).join('');

    container.innerHTML = `
      <span class="chapter-tag">${data.tag}</span>
      <h2 class="chapter-title">${data.title}</h2>
      <div class="chapter-quote">${data.quote}</div>
      <ul class="logic-list">${pointsHtml}</ul>
    `;

    document.getElementById('sceneCounter').textContent = `第 ${index + 1} / ${scenesData.length} 幕`;
    document.getElementById('progressFill').style.width = `${((index + 1) / scenesData.length) * 100}%`;
  }

  function goToScene(index) {
    currentScene = index;
    document.querySelectorAll('.scene').forEach((el, i) => {
      el.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.step-dot').forEach((el, i) => {
      el.classList.toggle('active', i === index);
    });
    renderSidebar(index);
  }

  function nextScene() {
    goToScene((currentScene + 1) % scenesData.length);
  }

  function prevScene() {
    goToScene((currentScene - 1 + scenesData.length) % scenesData.length);
  }

  function toggleAutoPlay() {
    const btn = document.getElementById('autoPlayBtn');
    if (autoPlayTimer) {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
      btn.textContent = '▶ 自动巡演';
    } else {
      autoPlayTimer = setInterval(nextScene, 6500);
      btn.textContent = '⏸ 暂停巡演';
    }
  }

  // 键盘左右键支持
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextScene();
    if (e.key === 'ArrowLeft') prevScene();
  });

  // 初始化渲染第一幕
  renderSidebar(0);
</script>
